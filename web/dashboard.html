<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Greenpoint</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Dashboard"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0a0a"/>
<!-- Safety-net meta refresh: the page reloads itself once per hour
     no matter what. JS polling normally keeps it current, but if JS
     silently dies this ensures we never show hours-stale data. -->
<meta http-equiv="refresh" content="3600">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700&family=PT+Mono&family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet"/>
<style>
/* ──────────────────────────────────────────────────────────────────
   v6 — glance-optimized dashboard. One view, hero + compact table.
   UI/UX + IA audit produced this: answer the dominant question first
   (the next catchable train), make it MASSIVE, push everything else
   into a thin bar at top and a tight table below.
   ────────────────────────────────────────────────────────────────── */
:root {
  --paper:   #f3e8cd;
  --paper-2: #e5d8b6;
  --ink:     #0a0a0a;
  --muted:   #7a7365;
  --hair:    rgba(10,10,10,0.16);
  --red:     #c4201e;
  --red-2:   #8a1513;
  --ochre:   #d4a017;
  --uv-low:   #2e7d32;
  --uv-mod:   #d4a017;
  --uv-high:  #e65100;
  --uv-vhigh: #c4201e;
  --uv-extrm: #6a1b9a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'PT Sans', Arial, sans-serif;
  font-size: 20px;
  -webkit-font-smoothing: antialiased;
}
body.dark-mode {
  --paper:   #1a1510;
  --paper-2: #2a2318;
  --ink:     #f3e8cd;
  --muted:   #8a7d68;
  --hair:    rgba(243,232,205,0.16);
}

.frame {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  height: 100vh;
  padding: 20px 28px;
  gap: 14px;
}

/* ══════════════════════════════════════════════════════════════
   STATUS BAR — time + date + weather + UV all in one thin row.
   Everything secondary lives here; it stays out of the hero's way.
   ══════════════════════════════════════════════════════════════ */
.status-bar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 28px;
  padding: 14px 22px;
  background: var(--ink);
  color: var(--paper);
  border: 2px solid var(--ink);
}
.sb-time {
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: clamp(38px, 4vw, 64px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.sb-time .ampm {
  font-family: 'PT Sans', sans-serif;
  font-weight: 700;
  font-size: 0.4em;
  margin-left: 8px;
  letter-spacing: 0.12em;
  opacity: 0.8;
  vertical-align: 0.4em;
}
.sb-time .date {
  display: inline-block;
  font-family: 'PT Mono', monospace;
  font-weight: 700;
  font-size: 0.24em;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-left: 22px;
  opacity: 0.65;
  vertical-align: 1.6em;
}
.sb-weather {
  display: flex; align-items: baseline; gap: 16px;
  min-width: 0;
  overflow: hidden;
}
.sb-weather .temp {
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: clamp(36px, 3.8vw, 56px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.sb-weather .temp .deg { color: var(--red); }
.sb-weather .cond {
  font-family: 'PT Sans', sans-serif;
  font-weight: 700;
  font-size: clamp(18px, 1.7vw, 26px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sb-weather .feels {
  font-family: 'PT Mono', monospace;
  font-size: clamp(12px, 1vw, 14px);
  letter-spacing: 0.1em;
  opacity: 0.7;
}
.sb-uv {
  display: flex; align-items: baseline; gap: 10px;
  padding: 6px 14px;
  background: var(--paper);
  color: var(--ink);
  font-family: 'PT Sans', sans-serif;
  font-weight: 700;
  font-size: clamp(13px, 1.15vw, 16px);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
}
.sb-uv .v {
  font-family: 'PT Serif', serif;
  font-size: clamp(22px, 2vw, 30px);
  line-height: 1;
  letter-spacing: 0;
}
.sb-uv .badge {
  padding: 2px 8px;
  color: var(--paper);
  font-size: 0.85em;
  letter-spacing: 0.14em;
}
.sb-uv.low   .badge { background: var(--uv-low); }
.sb-uv.mod   .badge { background: var(--uv-mod); color: var(--ink); }
.sb-uv.high  .badge { background: var(--uv-high); }
.sb-uv.vhigh .badge { background: var(--uv-vhigh); }
.sb-uv.extrm .badge { background: var(--uv-extrm); }

/* ══════════════════════════════════════════════════════════════
   ALERT RIBBON — MTA delay, appears only when active
   ══════════════════════════════════════════════════════════════ */
.alert-ribbon {
  display: none;
  align-items: center; gap: 14px;
  padding: 10px 18px;
  background: var(--red); color: var(--paper);
  border: 2px solid var(--red-2);
  font-family: 'PT Sans', sans-serif;
  font-size: clamp(14px, 1.3vw, 18px);
  font-weight: 500;
  letter-spacing: 0.02em;
}
.alert-ribbon.visible { display: flex; }
.alert-ribbon .label {
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding-right: 14px;
  border-right: 2px solid rgba(255,255,255,0.4);
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════════════════
   HERO — THE next catchable train. Fills the middle. Biggest thing
   on the screen by a wide margin. At 10 feet this should be the
   only thing you can read.
   ══════════════════════════════════════════════════════════════ */
.hero {
  flex: 1;
  display: grid;
  grid-template-rows: auto auto auto;
  align-content: center;
  justify-items: start;
  gap: 22px;
  padding: 26px 44px;
  background: var(--paper);
  color: var(--ink);
  border: 3px solid var(--ink);
  min-height: 0;
  position: relative;
}
.hero.action-now  { background: var(--red); color: var(--paper); border-color: var(--red); }
.hero.action-soon { background: var(--paper); color: var(--ink); }
.hero.action-miss { background: var(--paper); color: var(--ink); }

.hero .verdict {
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: clamp(110px, 12vw, 210px);
  line-height: 0.92;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  max-width: 100%;
}
.hero .when {
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: clamp(48px, 4.6vw, 78px);
  line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  color: currentColor;
  opacity: 0.94;
}
.hero .where {
  font-family: 'PT Sans', sans-serif;
  font-weight: 700;
  font-size: clamp(22px, 2.2vw, 34px);
  letter-spacing: 0.02em;
  line-height: 1.2;
  color: currentColor;
  opacity: 0.88;
}
.hero .where .line-badge {
  display: inline-block;
  width: 1.3em; height: 1.3em;
  border-radius: 50%;
  text-align: center;
  line-height: 1.3;
  color: #fff;
  background: #a7a9ac;
  font-family: 'PT Serif', serif;
  font-weight: 700;
  margin-right: 10px;
  font-size: 0.9em;
  vertical-align: -0.16em;
}
.hero .where .line-badge.line-L { background: #a7a9ac; }
.hero .where .line-badge.line-G { background: #6cbe45; }

/* A tiny nothing-to-catch state */
.hero.empty .verdict {
  font-size: clamp(70px, 7vw, 120px);
  color: var(--muted);
}

/* ══════════════════════════════════════════════════════════════
   STATION TABLE — all 3 stations, both directions, tight rows.
   Fallback / backup view if the hero's choice doesn't fit.
   ══════════════════════════════════════════════════════════════ */
.station-table {
  display: flex; flex-direction: column;
  background: var(--paper);
  border: 2px solid var(--ink);
}
.st-row {
  display: grid;
  grid-template-columns: auto auto 1fr 1fr auto;
  align-items: center;
  gap: 22px;
  padding: 12px 22px;
  border-bottom: 1px solid var(--hair);
}
.st-row:last-child { border-bottom: none; }
.st-row .circle {
  width: 40px; height: 40px; border-radius: 50%;
  background: #a7a9ac; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: 22px;
  line-height: 1;
}
.st-row .circle.line-L { background: #a7a9ac; }
.st-row .circle.line-G { background: #6cbe45; }
.st-row .name {
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: clamp(20px, 1.9vw, 28px);
  letter-spacing: -0.005em;
  min-width: 140px;
  white-space: nowrap;
}
.st-row .dir {
  display: flex; align-items: baseline; gap: 10px;
  font-family: 'PT Sans', sans-serif;
  min-width: 0;
}
.st-row .dir .arrow {
  font-family: 'PT Serif', serif;
  color: var(--red); font-weight: 700;
  font-size: clamp(18px, 1.6vw, 24px);
  line-height: 1;
}
.st-row .dir .terminus {
  font-family: 'PT Mono', monospace;
  font-size: clamp(11px, 0.95vw, 13px);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  white-space: nowrap;
  margin-right: 2px;
}
.st-row .dir .time {
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: clamp(24px, 2.2vw, 34px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.st-row .dir .time.missed { opacity: 0.3; }
.st-row .dir .time.catch  { color: var(--red); }
.st-row .walk {
  font-family: 'PT Mono', monospace;
  font-weight: 700;
  font-size: clamp(11px, 0.95vw, 13px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: right;
  white-space: nowrap;
}
.st-row.hero-station {
  background: rgba(196, 32, 30, 0.08);
  border-left: 4px solid var(--red);
  padding-left: 18px;
}

/* ══════════════════════════════════════════════════════════════
   FOOTER — sun info + live status
   ══════════════════════════════════════════════════════════════ */
.footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px;
  background: var(--paper);
  border: 1px solid var(--hair);
  font-family: 'PT Mono', monospace;
  font-size: clamp(12px, 1.05vw, 15px);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  gap: 20px;
}
.footer .item { display: inline-flex; align-items: baseline; gap: 6px; }
.footer .item .v {
  color: var(--ink);
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: 1.15em;
  letter-spacing: 0;
  text-transform: none;
}
.footer .live { display: inline-flex; align-items: center; gap: 8px; }
.footer .dot {
  width: 8px; height: 8px;
  background: var(--red);
  animation: blink 1.6s steps(2, start) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0.3 } }

/* ══════════════════════════════════════════════════════════════
   OPTIONAL SLOGAN TICKER — default hidden, toggled from /control
   ══════════════════════════════════════════════════════════════ */
.slogan-bar {
  display: none;
  align-items: center; gap: 18px;
  padding: 12px 22px;
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--ink);
}
body.show-slogan .slogan-bar { display: flex; }
.slogan-bar .lenin {
  flex: 0 0 auto; width: 54px; height: 64px;
  background-color: var(--red);
  -webkit-mask: url('/assets/lenin.svg') no-repeat center / contain;
          mask: url('/assets/lenin.svg') no-repeat center / contain;
}
.slogan-bar .slogan-text {
  font-family: 'Fraunces', 'PT Serif', serif;
  font-weight: 500;
  font-size: clamp(18px, 1.6vw, 24px);
  font-variation-settings: "opsz" 96;
  line-height: 1.25;
  flex: 1; min-width: 0;
  transition: opacity 0.4s ease;
}
.slogan-bar .slogan-text.fade { opacity: 0; }
.slogan-bar .slogan-text .attr {
  display: inline-block;
  color: var(--red);
  font-style: italic;
  font-size: 0.7em;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-left: 12px;
}

.legacy { display: none; }
</style>
</head>
<body>

<div class="frame">

  <!-- ═════ STATUS BAR ═════ -->
  <div class="status-bar">
    <div class="sb-time">
      <span id="bigClock">—</span><span class="ampm" id="ampm">—</span>
      <span class="date" id="dateLabel">—</span>
    </div>
    <div class="sb-weather">
      <div class="temp"><span id="tempNow">—</span><span class="deg">°</span></div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
        <div class="cond" id="weatherDesc">Loading…</div>
        <div class="feels" id="feelsLike">—</div>
      </div>
    </div>
    <div class="sb-uv low" id="uvBox">
      UV <span class="v" id="uvValue">—</span> <span class="badge" id="uvLabel">Low</span>
    </div>
  </div>

  <!-- ═════ ALERT RIBBON (conditional) ═════ -->
  <div class="alert-ribbon" id="alertRibbon" style="display:none;">
    <span class="label">L-Line Alert</span>
    <span id="alertBody">—</span>
  </div>

  <!-- ═════ HERO ═════ -->
  <section class="hero" id="hero">
    <div class="verdict" id="heroVerdict">…</div>
    <div class="when" id="heroWhen">—</div>
    <div class="where" id="heroWhere">—</div>
  </section>

  <!-- ═════ STATION TABLE ═════ -->
  <div class="station-table" id="stationTable"></div>

  <!-- ═════ OPTIONAL SLOGAN TICKER (hidden unless CMS toggles it on) ═════ -->
  <div class="slogan-bar">
    <div class="lenin" role="img" aria-label="Lenin silhouette"></div>
    <div class="slogan-text" id="sloganText">Workers of the L-line, unite!<span class="attr">— K. Marx</span></div>
  </div>

  <!-- ═════ FOOTER ═════ -->
  <div class="footer" id="footerBar">
    <span class="item">Sunrise <span class="v" id="sunrise">—</span></span>
    <span class="item" id="untilWrap"><span id="sunDirLabel">Until sunset</span> <span class="v" id="sunDaylight">—</span></span>
    <span class="item">Sunset <span class="v" id="sunset">—</span></span>
    <span class="live"><span class="dot"></span><span id="statusRight">Live</span></span>
  </div>

</div>

<!-- legacy IDs for backend compat -->
<span id="seconds" class="legacy"></span>
<span id="weatherIcon" class="legacy"></span>
<span id="dateSub" class="legacy"></span>
<span id="weatherAdvice" class="legacy"></span>
<span id="wxDayLabel" class="legacy"></span>
<span id="uvWarn" class="legacy"></span>
<span id="hiTemp" class="legacy"></span>
<span id="loTemp" class="legacy"></span>
<span id="tempC" class="legacy"></span>
<span id="location" class="legacy"></span>
<span id="trainsUpdated" class="legacy"></span>
<span id="forecastStrip" class="legacy"></span>
<span id="trainTiles" class="legacy"></span>

<script>
// ═════════════════════════════════════════════════════════════════
// CONFIG
// ═════════════════════════════════════════════════════════════════
const WALK_MIN = {
  'Nassau Av':  9,
  'Graham Av':  12,
  'Bedford Av': 20,
};
const STATIONS = ['Nassau Av', 'Graham Av', 'Bedford Av'];
const SLOGAN_ROTATE_MS = 15_000;
const ALERT_ROTATE_MS  = 12_000;

// ═════════════════════════════════════════════════════════════════
// HELPERS
// ═════════════════════════════════════════════════════════════════
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}
function fmtClockShort(date) {
  let h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
}
function fmtClockCompact(date) {
  let h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'p' : 'a';
  h = h % 12 || 12;
  return h + ':' + m + ap;
}
function hoursMinutesBetween(a, b) {
  const totalMin = Math.abs(Math.round((b - a) / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return m + ' min';
  if (m === 0) return h + ' hr';
  return h + 'h ' + m + 'm';
}

// ═════════════════════════════════════════════════════════════════
// CLOCK
// ═════════════════════════════════════════════════════════════════
function tickClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const mm = String(m).padStart(2, '0');
  document.getElementById('bigClock').textContent = h + ':' + mm;
  document.getElementById('ampm').textContent = ampm;
  document.getElementById('seconds').textContent = String(now.getSeconds()).padStart(2,'0');
  const weekday = now.toLocaleDateString('en-US', { weekday: 'short' });
  const md = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  document.getElementById('dateLabel').textContent = weekday + ' · ' + md;
}
tickClock();
setInterval(tickClock, 1000);

// ═════════════════════════════════════════════════════════════════
// WEATHER
// ═════════════════════════════════════════════════════════════════
const WMO_LABEL = {
  0:'Clear', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
  45:'Fog', 48:'Freezing fog',
  51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
  61:'Light rain', 63:'Rain', 65:'Heavy rain',
  71:'Light snow', 73:'Snow', 75:'Heavy snow', 77:'Snow grains',
  80:'Rain showers', 81:'Heavy showers', 82:'Violent showers',
  85:'Snow showers', 86:'Heavy snow showers',
  95:'Thunderstorm', 96:'Thunderstorm + hail', 99:'Severe storm',
};
function uvLevel(v) {
  if (v == null) return { key: 'low', label: 'N/A' };
  if (v < 3)  return { key: 'low',   label: 'Low' };
  if (v < 6)  return { key: 'mod',   label: 'Moderate' };
  if (v < 8)  return { key: 'high',  label: 'High' };
  if (v < 11) return { key: 'vhigh', label: 'Very High' };
  return        { key: 'extrm', label: 'Extreme' };
}

let weatherData = null;
function renderWeather() {
  if (!weatherData) return;
  const d = weatherData, cur = d.current;
  const code = cur.weather_code;
  const tempF = cur.temperature_2m;

  document.getElementById('tempNow').textContent = Math.round(tempF);
  document.getElementById('weatherDesc').textContent = WMO_LABEL[code] || 'Weather';
  const parts = ['Feels ' + Math.round(cur.apparent_temperature) + '°'];
  if (cur.wind_speed_10m != null) parts.push(Math.round(cur.wind_speed_10m) + ' mph wind');
  if (cur.relative_humidity_2m != null) parts.push(cur.relative_humidity_2m + '% hum');
  document.getElementById('feelsLike').textContent = parts.join(' · ');

  const uv = uvLevel(cur.uv_index);
  const uvBox = document.getElementById('uvBox');
  uvBox.classList.remove('low','mod','high','vhigh','extrm');
  uvBox.classList.add(uv.key);
  document.getElementById('uvValue').textContent = Math.round(cur.uv_index || 0);
  document.getElementById('uvLabel').textContent = uv.label;

  // Sun info in footer
  const daily = d.daily;
  if (daily && daily.sunrise && daily.sunset) {
    const sr = new Date(daily.sunrise[0]);
    const ss = new Date(daily.sunset[0]);
    document.getElementById('sunrise').textContent = fmtClockCompact(sr);
    document.getElementById('sunset').textContent  = fmtClockCompact(ss);
    const now = new Date();
    if (now < sr) {
      document.getElementById('sunDirLabel').textContent = 'Until sunrise';
      document.getElementById('sunDaylight').textContent = hoursMinutesBetween(now, sr);
    } else if (now < ss) {
      document.getElementById('sunDirLabel').textContent = 'Until sunset';
      document.getElementById('sunDaylight').textContent = hoursMinutesBetween(now, ss);
    } else {
      const nextRise = daily.sunrise[1] ? new Date(daily.sunrise[1]) : null;
      document.getElementById('sunDirLabel').textContent = 'Until sunrise';
      document.getElementById('sunDaylight').textContent = nextRise ? hoursMinutesBetween(now, nextRise) : '—';
    }
  }
}
async function refreshWeather() {
  try {
    const r = await fetch('/api/weather');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    weatherData = j.data;
    renderWeather();
  } catch (e) {
    document.getElementById('weatherDesc').textContent = 'Offline';
  }
}
refreshWeather();
setInterval(refreshWeather, 10 * 60 * 1000);
setInterval(() => { if (weatherData) renderWeather(); }, 60 * 1000);

// ═════════════════════════════════════════════════════════════════
// TRAINS
// ═════════════════════════════════════════════════════════════════
let trainsData = null;

// Find the BEST catchable option across stations + directions, preferring:
//   1) the direction the user most likely wants (Manhattan/Queens-bound = N)
//   2) the soonest leave-time
// Returns { station, line, dirKey, dirLabel, terminus, arrivalMin, leaveInMin, arrivalAt, catchable:true } or
// { status: 'miss' } if nothing catchable, or { status: 'empty' } if no data.
function pickHeroTrain() {
  if (!trainsData || !trainsData.stations) return { status: 'empty' };

  const candidates = [];
  for (const s of trainsData.stations) {
    const walk = WALK_MIN[s.name] ?? 5;
    ['N', 'S'].forEach(dirKey => {
      const dir = s.directions?.[dirKey];
      const trains = dir?.trains || [];
      const catchMin = trains.find(m => m >= walk + 1);
      if (catchMin == null) return;
      candidates.push({
        station: s.name,
        line: s.line,
        dirKey,
        dirLabel: dir.label,
        terminus: dir.terminus,
        arrivalMin: catchMin,
        leaveInMin: catchMin - walk,
        arrivalAt: new Date(Date.now() + catchMin * 60_000),
        walkMin: walk,
      });
    });
  }

  if (!candidates.length) return { status: 'miss' };

  // Sort: prefer Manhattan/Queens-bound (N) then by soonest leave-time
  candidates.sort((a, b) => {
    if (a.dirKey !== b.dirKey) return a.dirKey === 'N' ? -1 : 1;
    return a.leaveInMin - b.leaveInMin;
  });

  // But if the soonest N is more than 15 min away AND there's a much-sooner S,
  // pick the S (user might be going home / coming back).
  const bestN = candidates.find(c => c.dirKey === 'N');
  const bestS = candidates.find(c => c.dirKey === 'S');
  if (bestN && bestS && bestN.leaveInMin > 15 && bestS.leaveInMin < bestN.leaveInMin - 5) {
    return { status: 'ok', ...bestS };
  }
  return { status: 'ok', ...(bestN || candidates[0]) };
}

function renderHero() {
  const hero = document.getElementById('hero');
  const verdict = document.getElementById('heroVerdict');
  const when = document.getElementById('heroWhen');
  const where = document.getElementById('heroWhere');
  hero.classList.remove('action-now', 'action-soon', 'action-miss', 'empty');

  const pick = pickHeroTrain();
  if (pick.status === 'empty') {
    hero.classList.add('empty');
    verdict.textContent = 'Loading trains…';
    when.textContent = '';
    where.textContent = '';
    return;
  }
  if (pick.status === 'miss') {
    hero.classList.add('empty', 'action-miss');
    verdict.textContent = 'No catchable train';
    when.textContent = 'Check back soon';
    where.textContent = 'All upcoming arrivals are too close for the walk.';
    return;
  }

  // ok: pick contains a catchable train
  const leaveIn = pick.leaveInMin;
  if (leaveIn <= 0) {
    verdict.textContent = 'LEAVE NOW';
    hero.classList.add('action-now');
  } else if (leaveIn <= 3) {
    verdict.textContent = 'Leave in ' + leaveIn + ' min';
    hero.classList.add('action-now');
  } else if (leaveIn <= 10) {
    verdict.textContent = 'Leave in ' + leaveIn + ' min';
    hero.classList.add('action-soon');
  } else {
    verdict.textContent = 'Leave in ' + leaveIn + ' min';
    hero.classList.add('action-soon');
  }

  when.textContent = 'for the ' + fmtClockShort(pick.arrivalAt) + ' train';

  where.textContent = '';
  const badge = el('span', 'line-badge line-' + pick.line, pick.line);
  where.appendChild(badge);
  where.appendChild(document.createTextNode(
    pick.station + '  ·  ' + pick.dirLabel.toLowerCase() + ' (' + pick.terminus + ')  ·  ' + pick.walkMin + ' min walk'
  ));
}

function renderStationTable() {
  const host = document.getElementById('stationTable');
  host.textContent = '';
  if (!trainsData || !trainsData.stations) return;

  const hero = pickHeroTrain();
  const heroKey = (hero.status === 'ok') ? (hero.station + '|' + hero.dirKey) : null;

  trainsData.stations.forEach(s => {
    const walk = WALK_MIN[s.name] ?? 5;
    const row = el('div', 'st-row');
    row.appendChild(el('div', 'circle line-' + s.line, s.line));
    row.appendChild(el('div', 'name', s.name));

    ['N', 'S'].forEach(dirKey => {
      const dir = s.directions?.[dirKey] || {};
      const trains = dir.trains || [];
      const catchMin = trains.find(m => m >= walk + 1);
      const arrow = dirKey === 'N' ? '←' : '→';
      const dirCol = el('div', 'dir');
      dirCol.appendChild(el('span', 'arrow', arrow));
      dirCol.appendChild(el('span', 'terminus', (dir.terminus || '')));

      if (trains.length === 0) {
        dirCol.appendChild(el('span', 'time missed', '—'));
      } else {
        const showN = 2;
        trains.slice(0, showN).forEach((m, i) => {
          const span = el('span', 'time', m + 'm');
          if (m < walk + 1) span.classList.add('missed');
          else if (m === catchMin) span.classList.add('catch');
          if (i > 0) dirCol.appendChild(document.createTextNode(' · '));
          dirCol.appendChild(span);
        });
      }
      row.appendChild(dirCol);
    });

    const walkEl = el('div', 'walk', walk + ' min walk');
    row.appendChild(walkEl);

    if (heroKey === (s.name + '|N') || heroKey === (s.name + '|S')) {
      row.classList.add('hero-station');
    }
    host.appendChild(row);
  });
}

async function refreshTrains() {
  try {
    const r = await fetch('/api/trains');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    trainsData = j.data;
    renderHero();
    renderStationTable();
    renderAlerts(trainsData.alerts || []);
    document.getElementById('statusRight').textContent = 'Live';
  } catch (e) {
    document.getElementById('statusRight').textContent = 'Retry';
  }
}
refreshTrains();
setInterval(refreshTrains, 20 * 1000);
// Re-render hero every 30s so "leave in N min" counts down even
// between full refreshes.
setInterval(() => { if (trainsData) { renderHero(); renderStationTable(); } }, 30 * 1000);

// ═════════════════════════════════════════════════════════════════
// ALERTS
// ═════════════════════════════════════════════════════════════════
let alertList = [], alertIdx = 0;
function renderAlerts(alerts) {
  alertList = alerts || [];
  const rib = document.getElementById('alertRibbon');
  if (!alertList.length) { rib.classList.remove('visible'); rib.style.display='none'; return; }
  rib.classList.add('visible');
  rib.style.display = 'flex';
  alertIdx = alertIdx % alertList.length;
  document.getElementById('alertBody').textContent = alertList[alertIdx].header;
}
setInterval(() => {
  if (!alertList.length) return;
  alertIdx = (alertIdx + 1) % alertList.length;
  document.getElementById('alertBody').textContent = alertList[alertIdx].header;
}, ALERT_ROTATE_MS);

// ═════════════════════════════════════════════════════════════════
// AUTO-RELOAD on new Worker version
// ═════════════════════════════════════════════════════════════════
let _seenVersion = null;
async function checkVersion() {
  try {
    const r = await fetch('/api/version', { cache: 'no-cache' });
    const j = await r.json();
    if (_seenVersion && j.version !== _seenVersion) { location.reload(); return; }
    _seenVersion = j.version;
  } catch (e) {}
}
checkVersion();
setInterval(checkVersion, 30_000);

// ═════════════════════════════════════════════════════════════════
// CMS SETTINGS
// ═════════════════════════════════════════════════════════════════
let _settings = null;
async function pollSettings() {
  try {
    const r = await fetch('/api/settings', { cache: 'no-cache' });
    const j = await r.json();
    if (!j.ok) return;
    applySettings(j.data);
  } catch (e) {}
}
function applySettings(s) {
  if (!s) return;
  const prev = _settings || {};
  _settings = s;

  // Reload when /control bumps the token
  if (prev.reload_token !== undefined &&
      s.reload_token !== undefined &&
      Number(s.reload_token) > Number(prev.reload_token || 0)) {
    location.reload();
    return;
  }

  const b = Math.max(10, Math.min(100, Number(s.brightness ?? 100)));
  document.body.style.filter = 'brightness(' + b + '%)';

  document.body.classList.toggle('show-slogan', !!s.show_slogan);

  const footer = document.getElementById('footerBar');
  if (footer) footer.style.display = (s.show_footer === false) ? 'none' : '';

  document.body.classList.toggle('dark-mode', !!s.dark_mode);
}
pollSettings();
setInterval(pollSettings, 3_000);

// ═════════════════════════════════════════════════════════════════
// SLOGAN BANK (only used when CMS enables ticker)
// ═════════════════════════════════════════════════════════════════
const SLOGANS = [
  { t: "Workers of the world, unite!", a: "K. Marx & F. Engels, 1848" },
  { t: "There are decades where nothing happens, and weeks where decades happen.", a: "V. Lenin" },
  { t: "Pessimism of the intellect, optimism of the will.", a: "A. Gramsci" },
  { t: "A spectre is haunting Greenpoint — the G train.", a: "Manifesto, adapted" },
  { t: "Supply-side progressivism.", a: "E. Klein" },
  { t: "The permit is the regulation.", a: "J. Demsas" },
  { t: "Freeze the rent. Free the buses. Finish the Second Avenue Subway in this century.", a: "Z. Mamdani, apocryphal" },
  { t: "Solidarity with the workers. Reform the work rules.", a: "DSA transit caucus, apocryphal" },
  { t: "A progressivism that cannot build is not progressive.", a: "abundance agenda" },
  { t: "History repeats itself — first as tragedy, then as shuttle bus.", a: "K. Marx, adapted" },
  { t: "Trust the MTA, but verify.", a: "V. Lenin, adapted" },
  { t: "The unions are not the problem. They are negotiating inside a broken system.", a: "R. Barkan, adapted" },
  { t: "The real enemy is not the capitalist. It is the discretionary review process.", a: "abundance progressive" },
  { t: "Comrades, we will not stop until every bodega has a functional slushee machine.", a: "Z. Mamdani, apocryphal" },
  { t: "Build it fast, build it cheap, build it union — pick two. Actually, pick one.", a: "NYC transit joke" },
];
let sloganIdx = Math.floor(Math.random() * SLOGANS.length);
function rotateSlogan() {
  const node = document.getElementById('sloganText');
  if (!node) return;
  let next;
  do { next = Math.floor(Math.random() * SLOGANS.length); }
  while (SLOGANS.length > 1 && next === sloganIdx);
  sloganIdx = next;
  const s = SLOGANS[sloganIdx];
  node.classList.add('fade');
  setTimeout(() => {
    node.textContent = '';
    const body = document.createElement('span');
    body.textContent = '"' + s.t + '"';
    node.appendChild(body);
    if (s.a) {
      const a = document.createElement('span');
      a.className = 'attr';
      a.textContent = '— ' + s.a;
      node.appendChild(a);
    }
    node.classList.remove('fade');
  }, 400);
}
rotateSlogan();
setInterval(rotateSlogan, SLOGAN_ROTATE_MS);
</script>
