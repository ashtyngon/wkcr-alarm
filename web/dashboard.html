<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ГРИНПОЙНТ · GREENPOINT</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Greenpoint"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ──────────────────────────────────────────────────────────────────
   Soviet avant-garde dashboard, v2.
   Train verdicts are the main event — they fill the center of the
   screen. Time + weather live in a compact top strip; date, sunrise
   & sunset in a thin footer.
   ────────────────────────────────────────────────────────────────── */
:root {
  --paper:   #f2e7cc;
  --paper-2: #e5d8b8;
  --ink:     #0a0a0a;
  --red:     #c4201e;
  --ochre:   #d4a017;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
}
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 18px;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 70% 10%, rgba(0,0,0,0.04), transparent 60%),
    radial-gradient(ellipse at 10% 90%, rgba(196, 32, 30, 0.06), transparent 55%);
}

.frame {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  padding: 24px 36px;
  gap: 20px;
  position: relative;
}

/* ══════════════════════════════════════════════════════════════
   TOP STRIP — time + weather in a single horizontal band.
   Compact but still prominent, leaves center for trains.
   ══════════════════════════════════════════════════════════════ */
.top {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: stretch;
  gap: 0;
  border: 4px solid var(--ink);
}

.top .time {
  background: var(--red);
  color: var(--paper);
  padding: 8px 24px 10px;
  display: flex; align-items: baseline; gap: 14px;
  min-width: 0;
}
.top .time .nums {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(64px, 7vw, 110px);
  line-height: 0.92;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.top .time .ampm {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(18px, 1.6vw, 26px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.9;
}

.top .wx {
  background: var(--ink);
  color: var(--paper);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 20px;
  min-width: 0;
}
.top .wx .temp {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(56px, 6vw, 96px);
  line-height: 0.92;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: flex-start;
}
.top .wx .temp .deg { color: var(--red); }
.top .wx .caption {
  display: flex; flex-direction: column; gap: 4px;
  min-width: 0; flex: 1;
}
.top .wx .caption .label {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(22px, 2.2vw, 34px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
}
.top .wx .caption .sub {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.08em;
  font-weight: 500;
  opacity: 0.8;
  text-transform: uppercase;
}
.top .wx .caption .advice {
  font-family: 'Oswald', sans-serif;
  font-weight: 500;
  font-size: clamp(16px, 1.35vw, 20px);
  line-height: 1.2;
  opacity: 0.95;
  max-width: 40ch;
}

.top .place {
  background: var(--paper);
  color: var(--ink);
  padding: 8px 18px;
  border-left: 4px solid var(--ink);
  display: flex; flex-direction: column; justify-content: center;
  gap: 4px;
}
.top .place .cy {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(16px, 1.5vw, 22px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  line-height: 1;
}
.top .place .en {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(16px, 1.5vw, 22px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  line-height: 1;
  color: var(--red);
}
.top .place .zip {
  font-family: 'Roboto Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.2em;
  font-weight: 500;
  opacity: 0.7;
  margin-top: 2px;
}

/* ══════════════════════════════════════════════════════════════
   TRAIN FRAME — the main event
   ══════════════════════════════════════════════════════════════ */
.train-frame {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 14px;
  min-height: 0;
}
.train-header {
  display: flex; align-items: stretch;
  border: 4px solid var(--ink);
  background: var(--ink);
}
.train-header .L-badge {
  background: var(--ink);
  color: var(--paper);
  width: 70px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(42px, 4vw, 64px);
  line-height: 1;
  border-right: 4px solid var(--red);
}
.train-header .title {
  flex: 1;
  background: var(--red);
  color: var(--paper);
  padding: 10px 22px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  gap: 16px;
}
.train-header .title .big {
  font-size: clamp(22px, 2.4vw, 36px);
  line-height: 1;
}
.train-header .title .stat {
  font-family: 'Roboto Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.18em;
  font-weight: 500;
  opacity: 0.9;
  white-space: nowrap;
}

.stations {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  min-height: 0;
}
.stop {
  position: relative;
  display: flex; flex-direction: column;
  padding: 22px 26px 20px;
  border: 4px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  gap: 6px;
  min-height: 0;
  min-width: 0;
}
.stop.theme-red   { background: var(--red);   color: var(--paper); }
.stop.theme-black { background: var(--ink);   color: var(--paper); }
.stop.theme-cream { background: var(--paper); color: var(--ink); }

.stop-name {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(28px, 2.8vw, 48px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 0.95;
  margin-bottom: 2px;
}
.stop-badge {
  font-family: 'Roboto Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 500;
  opacity: 0.7;
  margin-bottom: 4px;
}

/* The verdict is the hero of this page. Huge slab type. */
.stop-verdict {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(56px, 6.5vw, 120px);
  line-height: 0.9;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  word-break: break-word;
  margin-top: auto;
  margin-bottom: auto;
}
.stop.theme-cream .stop-verdict.go     { color: var(--red); }
.stop.theme-cream .stop-verdict.soon   { color: var(--ink); }
.stop.theme-cream .stop-verdict.plenty { color: var(--ink); }
.stop.theme-cream .stop-verdict.miss   { color: var(--red); }
.stop.theme-red .stop-verdict   { color: var(--paper); }
.stop.theme-black .stop-verdict { color: var(--paper); }
.stop.theme-black .stop-verdict.go { color: var(--red); }

/* Single sub-line that explains the verdict in concrete terms */
.stop-sub {
  font-family: 'Oswald', sans-serif;
  font-weight: 500;
  font-size: clamp(20px, 1.9vw, 30px);
  line-height: 1.2;
  opacity: 0.95;
}

/* Two big data points per card — walk time + train time */
.stop-meta {
  padding-top: 14px;
  border-top: 3px solid currentColor;
  display: flex; justify-content: space-between; gap: 10px;
}
.stop-meta .m {
  display: flex; flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.stop-meta .m .k {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.65;
  font-weight: 500;
}
.stop-meta .m .v {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(20px, 1.9vw, 28px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* ══════════════════════════════════════════════════════════════
   FOOTER — date + sunrise/sunset + live status
   ══════════════════════════════════════════════════════════════ */
.footer {
  display: flex; align-items: stretch;
  border: 3px solid var(--ink);
}
.footer .cell {
  flex: 1;
  padding: 10px 18px;
  display: flex; align-items: center;
  gap: 14px;
  border-right: 3px solid var(--ink);
  min-width: 0;
}
.footer .cell:last-child { border-right: none; }
.footer .cell.inv { background: var(--ink); color: var(--paper); }
.footer .cell.red { background: var(--red); color: var(--paper); }
.footer .cell .k {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.65;
  font-weight: 500;
  white-space: nowrap;
}
.footer .cell .v {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(16px, 1.6vw, 24px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.footer .live-dot {
  display: inline-block;
  width: 10px; height: 10px;
  background: var(--paper);
  animation: blink 1.6s steps(2, start) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0.25 } }

/* legacy compat — hidden */
.legacy { display: none; }
</style>
</head>
<body>

<div class="frame">

  <!-- ═════ TOP STRIP ═════ -->
  <div class="top">
    <div class="time">
      <span class="nums"><span id="bigClock">—</span></span>
      <span class="ampm" id="ampm">—</span>
    </div>
    <div class="wx">
      <div class="temp"><span id="tempNow">—</span><span class="deg">°</span></div>
      <div class="caption">
        <div class="label" id="weatherDesc">LOADING…</div>
        <div class="sub" id="feelsLike">—</div>
        <div class="advice" id="weatherAdvice">—</div>
      </div>
    </div>
    <div class="place">
      <div class="cy">ГРИНПОЙНТ</div>
      <div class="en">GREENPOINT</div>
      <div class="zip">11222 · BK</div>
    </div>
  </div>

  <!-- ═════ TRAINS — MAIN EVENT ═════ -->
  <section class="train-frame">
    <div class="train-header">
      <div class="L-badge">L</div>
      <div class="title">
        <span class="big">MANHATTAN-BOUND · МЕТРО</span>
        <span class="stat" id="trainsUpdated">—</span>
      </div>
    </div>
    <div class="stations" id="trainTiles"></div>
  </section>

  <!-- ═════ FOOTER ═════ -->
  <div class="footer">
    <div class="cell">
      <span class="k">Date</span>
      <span class="v" id="dateLabel">—</span>
    </div>
    <div class="cell inv">
      <span class="k">Sunrise</span>
      <span class="v" id="sunrise">—</span>
    </div>
    <div class="cell">
      <span class="k" id="sunDirLabel">Until Sunset</span>
      <span class="v" id="sunDaylight">—</span>
    </div>
    <div class="cell inv">
      <span class="k">Sunset</span>
      <span class="v" id="sunset">—</span>
    </div>
    <div class="cell red">
      <span class="live-dot"></span>
      <span class="v" id="statusRight">LIVE</span>
    </div>
  </div>

</div>

<!-- Legacy placeholders kept for backend API compat -->
<span id="seconds" class="legacy"></span>
<span id="weatherIcon" class="legacy"></span>
<span id="dateSub" class="legacy"></span>
<span id="location" class="legacy">Greenpoint · 11222</span>
<span id="hiTemp" class="legacy"></span>
<span id="loTemp" class="legacy"></span>
<span id="forecastStrip" class="legacy"></span>

<script>
// ═════════════════════════════════════════════════════════════════
// CONFIG
// ═════════════════════════════════════════════════════════════════
const WALK_MIN = {
  'Nassau Av':  4,
  'Graham Av':  10,
  'Bedford Av': 18,
};
// Rotate card themes — classic constructivist poster palette cycle.
const STATION_THEME = ['theme-red', 'theme-cream', 'theme-black'];

// ═════════════════════════════════════════════════════════════════
// SAFE DOM
// ═════════════════════════════════════════════════════════════════
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}

// ═════════════════════════════════════════════════════════════════
// CLOCK
// ═════════════════════════════════════════════════════════════════
function fmtClock(date) {
  let h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
}
function fmtClockShort(date) {
  let h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + m + ap.toLowerCase();
}

function tickClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const mm = String(m).padStart(2, '0');
  document.getElementById('bigClock').textContent = h + ':' + mm;
  document.getElementById('ampm').textContent = ampm;
  document.getElementById('seconds').textContent = String(now.getSeconds()).padStart(2,'0');

  const weekday = now.toLocaleDateString('en-US', { weekday: 'short' }); // THU
  const md = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  document.getElementById('dateLabel').textContent = weekday + ' · ' + md;
}
tickClock();
setInterval(tickClock, 1000);

// ═════════════════════════════════════════════════════════════════
// WEATHER
// ═════════════════════════════════════════════════════════════════
const WMO_LABEL = {
  0:  'CLEAR', 1: 'MOSTLY CLEAR', 2: 'PARTLY CLOUDY', 3: 'OVERCAST',
  45: 'FOG', 48: 'FREEZING FOG',
  51: 'LIGHT DRIZZLE', 53: 'DRIZZLE', 55: 'HEAVY DRIZZLE',
  61: 'LIGHT RAIN', 63: 'RAIN', 65: 'HEAVY RAIN',
  71: 'LIGHT SNOW', 73: 'SNOW', 75: 'HEAVY SNOW', 77: 'SNOW GRAINS',
  80: 'RAIN SHOWERS', 81: 'HEAVY SHOWERS', 82: 'VIOLENT SHOWERS',
  85: 'SNOW SHOWERS', 86: 'HEAVY SNOW SHOWERS',
  95: 'THUNDERSTORM', 96: 'THUNDERSTORM + HAIL', 99: 'SEVERE STORM',
};

function weatherSummary(code, tempF) {
  if ([95,96,99].includes(code)) return 'Thunderstorms expected. Stay inside if you can.';
  if ([65,82].includes(code))    return 'Heavy rain — full umbrella and jacket.';
  if ([61,63,80,81].includes(code)) return 'Rain on and off. Grab an umbrella.';
  if ([51,53,55].includes(code)) return 'Light drizzle. A hood should handle it.';
  if ([71,73,75,77,85,86].includes(code)) return 'Snow is falling. Boots and extra time.';
  if ([45,48].includes(code))    return 'Foggy. Walk carefully.';
  if (code === 3)                return 'Overcast but dry. A sweater is enough.';
  if (code === 2)                return 'Partly cloudy. Pleasant mix of sun and shade.';
  if (code === 1)                return 'Mostly sunny. Easy day to be outside.';
  if (tempF >= 85) return 'Clear and hot. Sunscreen, hat, carry water.';
  if (tempF >= 70) return 'Clear and comfortable. Great day to be outside.';
  if (tempF >= 55) return 'Clear and mild. A light layer is plenty.';
  if (tempF >= 40) return 'Clear but cool. A jacket is a good idea.';
  return 'Clear and cold. Heavy coat and gloves.';
}

function hoursMinutesBetween(a, b) {
  const totalMin = Math.abs(Math.round((b - a) / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return m + ' MIN';
  if (m === 0) return h + ' HR';
  return h + 'H ' + m + 'M';
}

async function refreshWeather() {
  try {
    const r = await fetch('/api/weather');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    const d = j.data, cur = d.current, daily = d.daily;

    const code = cur.weather_code;
    const tempF = cur.temperature_2m;
    document.getElementById('tempNow').textContent = Math.round(tempF);
    document.getElementById('weatherDesc').textContent = WMO_LABEL[code] || 'WEATHER';
    document.getElementById('weatherAdvice').textContent = weatherSummary(code, tempF);
    document.getElementById('weatherIcon').textContent = 'wmo:' + code;

    // Compact sub-line: feels like · hi / lo
    const parts = ['Feels ' + Math.round(cur.apparent_temperature) + '°'];
    if (daily && daily.temperature_2m_max && daily.temperature_2m_max.length) {
      parts.push('Hi ' + Math.round(daily.temperature_2m_max[0]) + '°');
      parts.push('Lo ' + Math.round(daily.temperature_2m_min[0]) + '°');
      document.getElementById('hiTemp').textContent = Math.round(daily.temperature_2m_max[0]);
      document.getElementById('loTemp').textContent = Math.round(daily.temperature_2m_min[0]);
    }
    if (cur.wind_speed_10m != null) parts.push(Math.round(cur.wind_speed_10m) + ' mph wind');
    document.getElementById('feelsLike').textContent = parts.join(' · ');

    if (daily && daily.sunrise && daily.sunset) {
      const sunrise = new Date(daily.sunrise[0]);
      const sunset  = new Date(daily.sunset[0]);
      document.getElementById('sunrise').textContent = fmtClockShort(sunrise);
      document.getElementById('sunset').textContent  = fmtClockShort(sunset);
      const now = new Date();
      if (now < sunrise) {
        document.getElementById('sunDirLabel').textContent = 'Until Sunrise';
        document.getElementById('sunDaylight').textContent = hoursMinutesBetween(now, sunrise);
      } else if (now < sunset) {
        document.getElementById('sunDirLabel').textContent = 'Until Sunset';
        document.getElementById('sunDaylight').textContent = hoursMinutesBetween(now, sunset);
      } else {
        const nextRise = daily.sunrise[1] ? new Date(daily.sunrise[1]) : null;
        document.getElementById('sunDirLabel').textContent = 'Until Sunrise';
        document.getElementById('sunDaylight').textContent = nextRise ? hoursMinutesBetween(now, nextRise) : '—';
      }
    }
  } catch (e) {
    console.warn('weather', e);
    document.getElementById('weatherDesc').textContent = 'OFFLINE';
    document.getElementById('weatherAdvice').textContent =
      'Could not reach weather service. Retrying automatically.';
  }
}

// ═════════════════════════════════════════════════════════════════
// TRAINS — the main event
// ═════════════════════════════════════════════════════════════════
function verdictForStation(stopName, trains) {
  const walk = WALK_MIN[stopName] ?? 5;
  if (!trains || !trains.length) {
    return { klass: '', text: 'NO TRAINS', sub: 'Nothing scheduled.', leaveAt: '—', trainAt: '—', walk: walk + ' MIN' };
  }
  const catchable = trains.find(m => m >= walk + 1);
  if (catchable == null) {
    return {
      klass: 'soon',
      text: 'WAIT',
      sub: 'Next ' + trains[0] + ' min train too close to catch from a ' + walk + '-min walk.',
      leaveAt: '—',
      trainAt: trains[0] + 'M',
      walk: walk + ' MIN',
    };
  }
  const leaveIn = catchable - walk;
  const arriveAt = new Date(Date.now() + catchable * 60_000);
  const leaveAt  = new Date(Date.now() + leaveIn * 60_000);

  let klass, text;
  if (leaveIn <= 0)      { klass = 'go';     text = 'GO NOW'; }
  else if (leaveIn <= 2) { klass = 'go';     text = leaveIn + ' MIN'; }
  else if (leaveIn <= 6) { klass = 'soon';   text = leaveIn + ' MIN'; }
  else                   { klass = 'plenty'; text = leaveIn + ' MIN'; }

  const backups = trains.filter(m => m > catchable).slice(0, 2);
  const sub = 'Leave ' + (leaveIn <= 0 ? 'now' : 'in ' + leaveIn + ' min') +
              ' for the ' + fmtClock(arriveAt) + ' train' +
              (backups.length ? ' · then ' + backups.map(x => x + 'm').join(', ') : '');

  return {
    klass, text, sub,
    leaveAt: fmtClockShort(leaveAt),
    trainAt: fmtClockShort(arriveAt),
    walk: walk + ' MIN',
  };
}

function buildStop(s, idx) {
  const wrap = el('div', 'stop ' + (STATION_THEME[idx] || 'theme-cream'));
  wrap.appendChild(el('div', 'stop-name', s.name.toUpperCase()));
  wrap.appendChild(el('div', 'stop-badge', 'L LINE · MANHATTAN'));

  const v = verdictForStation(s.name, s.manhattan_bound);
  wrap.appendChild(el('div', 'stop-verdict ' + v.klass, v.text));
  wrap.appendChild(el('div', 'stop-sub', v.sub));

  const meta = el('div', 'stop-meta');
  const mk = (k, val) => {
    const m = el('div', 'm');
    m.appendChild(el('span', 'k', k));
    m.appendChild(el('span', 'v', val));
    return m;
  };
  meta.appendChild(mk('Walk', v.walk));
  meta.appendChild(mk('Leave', v.leaveAt));
  meta.appendChild(mk('Train', v.trainAt));
  wrap.appendChild(meta);
  return wrap;
}

async function refreshTrains() {
  try {
    const r = await fetch('/api/trains');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    const host = document.getElementById('trainTiles');
    host.textContent = '';
    const stations = (j.data && j.data.stations) || [];
    if (!stations.length) {
      const box = el('div', 'stop theme-cream');
      box.appendChild(el('div', 'stop-name', 'NO DATA'));
      host.appendChild(box);
      return;
    }
    stations.forEach((s, i) => host.appendChild(buildStop(s, i)));
    document.getElementById('trainsUpdated').textContent = 'UPD ' + fmtClock(new Date());
    document.getElementById('statusRight').textContent = 'LIVE';
  } catch (e) {
    console.warn('trains', e);
    const host = document.getElementById('trainTiles');
    host.textContent = '';
    const box = el('div', 'stop theme-black');
    box.appendChild(el('div', 'stop-name', 'MTA FEED OFFLINE'));
    box.appendChild(el('div', 'stop-sub', 'Retrying…'));
    host.appendChild(box);
    document.getElementById('statusRight').textContent = 'RETRY';
  }
}

// Kickoff
refreshWeather();
setInterval(refreshWeather, 10 * 60 * 1000);
refreshTrains();
setInterval(refreshTrains, 20 * 1000);
</script>
</body>
