<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ГРИНПОЙНТ</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Dashboard"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ──────────────────────────────────────────────────────────────────
   Soviet avant-garde wall dashboard, v3.
   - One station shown at a time, rotating every 30s, BOTH directions.
   - Weather rotates through current + next 7 days.
   - UV warning badge, dual F/C temperature display.
   - MTA service-alert ribbon when L-line delays are active.
   - Expanded 60-quote ticker from real revolutionary sources.
   ────────────────────────────────────────────────────────────────── */
:root {
  --paper:   #f2e7cc;
  --paper-2: #e5d8b8;
  --ink:     #0a0a0a;
  --red:     #c4201e;
  --red-2:   #8a1513;
  --ochre:   #d4a017;

  /* UV severity scale */
  --uv-low:    #2e7d32;  /* 0-2 */
  --uv-mod:    #d4a017;  /* 3-5 */
  --uv-high:   #e65100;  /* 6-7 */
  --uv-vhigh:  #c4201e;  /* 8-10 */
  --uv-extrm:  #6a1b9a;  /* 11+ */
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Oswald', Arial, sans-serif;
  font-size: 18px;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 70% 10%, rgba(0,0,0,0.04), transparent 60%),
    radial-gradient(ellipse at 10% 90%, rgba(196, 32, 30, 0.06), transparent 55%);
}

.frame {
  display: grid;
  grid-template-rows: auto auto auto auto 1fr auto;
  height: 100vh;
  padding: 20px 32px;
  gap: 12px;
  position: relative;
}

/* ══════════════════════════════════════════════════════════════
   TOP STRIP — clock, rotating weather, UV badge
   ══════════════════════════════════════════════════════════════ */
.top {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: stretch;
  border: 4px solid var(--ink);
}

.time-box {
  background: var(--red);
  color: var(--paper);
  padding: 10px 26px 12px;
  display: flex; align-items: baseline; gap: 16px;
}
.time-box .nums {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(72px, 7.8vw, 130px);
  line-height: 0.92;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.time-box .ampm {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(20px, 1.8vw, 30px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.9;
}

.wx-box {
  background: var(--ink);
  color: var(--paper);
  padding: 10px 24px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 22px;
  align-items: center;
  min-width: 0;
  transition: opacity 0.3s ease;
}
.wx-box.fade { opacity: 0; }
.wx-box .temp-col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.wx-box .temp {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(56px, 6.5vw, 100px);
  line-height: 0.9;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: flex-start; line-height: 1;
}
.wx-box .temp .deg { color: var(--red); font-size: 0.8em; }
.wx-box .temp-c {
  font-family: 'Roboto Mono', monospace;
  font-size: clamp(13px, 1.1vw, 16px);
  letter-spacing: 0.08em;
  opacity: 0.7;
  font-weight: 500;
  margin-top: -4px;
}
.wx-box .caption { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.wx-box .caption .day-label {
  font-family: 'Roboto Mono', monospace;
  font-size: clamp(11px, 1vw, 14px);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ochre);
  font-weight: 700;
  line-height: 1;
}
.wx-box .caption .label {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(22px, 2.4vw, 38px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1.02;
}
.wx-box .caption .sub {
  font-family: 'Roboto Mono', monospace;
  font-size: clamp(12px, 1vw, 14px);
  letter-spacing: 0.08em;
  font-weight: 500;
  opacity: 0.75;
  text-transform: uppercase;
}
.wx-box .caption .advice {
  font-family: 'Oswald', sans-serif;
  font-weight: 500;
  font-size: clamp(14px, 1.25vw, 18px);
  line-height: 1.2;
  opacity: 0.9;
  max-width: 52ch;
}

/* UV box (top-right) */
.uv-box {
  padding: 8px 18px;
  min-width: 120px;
  background: var(--paper);
  border-left: 4px solid var(--ink);
  display: flex; flex-direction: column; justify-content: center;
  gap: 3px;
  color: var(--ink);
}
.uv-box .k {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 600;
  opacity: 0.7;
}
.uv-box .v {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(34px, 3vw, 46px);
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
}
.uv-box .l {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 2px 6px;
  color: var(--paper);
  align-self: flex-start;
}
.uv-box.low   .l { background: var(--uv-low); }
.uv-box.mod   .l { background: var(--uv-mod); color: var(--ink); }
.uv-box.high  .l { background: var(--uv-high); }
.uv-box.vhigh .l { background: var(--uv-vhigh); }
.uv-box.extrm .l { background: var(--uv-extrm); }
.uv-box.high, .uv-box.vhigh, .uv-box.extrm {
  background: var(--paper-2);
}
.uv-box .warn {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 600;
  opacity: 0.7;
  line-height: 1.15;
  margin-top: 2px;
  max-width: 120px;
}

/* ══════════════════════════════════════════════════════════════
   7-DAY FORECAST STRIP — permanent, all 7 days side-by-side.
   NOT a rotation. Today's weather is in the top strip; this is
   the outlook for the days ahead.
   ══════════════════════════════════════════════════════════════ */
.forecast-week {
  display: grid;
  grid-template-columns: auto repeat(7, 1fr);
  border: 4px solid var(--ink);
  background: var(--ink);
}
.forecast-week .fw-label {
  background: var(--red);
  color: var(--paper);
  padding: 10px 18px;
  display: flex; flex-direction: column; justify-content: center;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  gap: 2px;
  min-width: 110px;
  letter-spacing: 0.1em;
}
.forecast-week .fw-label .big {
  font-size: clamp(15px, 1.4vw, 20px);
  letter-spacing: 0.14em;
  line-height: 1;
}
.forecast-week .fw-label .small {
  font-family: 'Roboto Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  font-weight: 500;
  opacity: 0.85;
}
.forecast-week .fw-cell {
  padding: 10px 12px;
  background: var(--paper);
  color: var(--ink);
  border-left: 2px solid var(--ink);
  display: flex; flex-direction: column; gap: 3px;
  min-width: 0;
}
.forecast-week .fw-cell:nth-child(3),
.forecast-week .fw-cell:nth-child(5),
.forecast-week .fw-cell:nth-child(7) {
  background: var(--ink); color: var(--paper);
}
.forecast-week .fw-cell .day {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(13px, 1.2vw, 16px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1;
}
.forecast-week .fw-cell .date {
  font-family: 'Roboto Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  opacity: 0.6;
  font-weight: 500;
}
.forecast-week .fw-cell .temps {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(20px, 2vw, 28px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.forecast-week .fw-cell .temps .lo {
  opacity: 0.5;
  font-size: 0.72em;
  margin-left: 6px;
}
.forecast-week .fw-cell .cond {
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 1.15;
  min-height: 1.15em;
}
.forecast-week .fw-cell .precip {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--red);
  letter-spacing: 0.05em;
}
.forecast-week .fw-cell:nth-child(3) .precip,
.forecast-week .fw-cell:nth-child(5) .precip,
.forecast-week .fw-cell:nth-child(7) .precip {
  color: var(--ochre);
}

/* ══════════════════════════════════════════════════════════════
   ALERT RIBBON — MTA service delays / suspensions.
   Hidden when there are no active L-line alerts.
   ══════════════════════════════════════════════════════════════ */
.alert-ribbon {
  display: none;  /* JS sets .visible when alerts exist */
  align-items: center;
  gap: 14px;
  padding: 8px 18px;
  background: var(--red);
  color: var(--paper);
  border: 3px solid var(--red-2);
}
.alert-ribbon.visible { display: flex; }
.alert-ribbon .siren {
  width: 22px; height: 22px;
  flex: 0 0 auto;
  background: var(--paper);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2 C6 2 5 8 5 14 H3 V16 H21 V14 H19 C19 8 18 2 12 2 Z M11 18 H13 V22 H11 V18 Z' fill='black'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2 C6 2 5 8 5 14 H3 V16 H21 V14 H19 C19 8 18 2 12 2 Z M11 18 H13 V22 H11 V18 Z' fill='black'/></svg>") center / contain no-repeat;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
.alert-ribbon .label {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  flex: 0 0 auto;
  padding-right: 14px;
  border-right: 2px solid rgba(255,255,255,0.4);
  white-space: nowrap;
}
.alert-ribbon .body {
  font-family: 'Oswald', sans-serif;
  font-weight: 500;
  font-size: clamp(13px, 1.1vw, 16px);
  letter-spacing: 0.04em;
  line-height: 1.25;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ══════════════════════════════════════════════════════════════
   SLOGAN BAR — Lenin + rotating communist quotes
   ══════════════════════════════════════════════════════════════ */
.slogan-bar {
  display: flex; align-items: center; gap: 18px;
  padding: 8px 20px;
  background: var(--ink);
  color: var(--paper);
  border: 3px solid var(--ink);
  min-height: 58px;
}
.slogan-bar .lenin {
  flex: 0 0 auto;
  width: 46px; height: 54px;
  background-color: var(--red);
  -webkit-mask: url('/assets/lenin.svg') no-repeat center / contain;
          mask: url('/assets/lenin.svg') no-repeat center / contain;
}
.slogan-bar .star {
  flex: 0 0 auto;
  width: 28px; height: 28px;
  color: var(--red);
}
.slogan-bar .slogan-text {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(14px, 1.4vw, 20px);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 1.2;
  flex: 1; min-width: 0;
  transition: opacity 0.4s ease;
}
.slogan-bar .slogan-text.fade { opacity: 0; }
.slogan-bar .slogan-text .quote-body {
  display: inline;
}
.slogan-bar .slogan-text .attr {
  display: inline-block;
  color: var(--red);
  font-weight: 500;
  margin-left: 14px;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════════════════
   STATION VIEW — one station, both directions side-by-side
   ══════════════════════════════════════════════════════════════ */
.station-view {
  position: relative;
  display: flex; flex-direction: column;
  border: 4px solid var(--ink);
  background: var(--paper);
  min-height: 0;
  overflow: hidden;
}
.station-view.fade { opacity: 0.3; }
.station-view, .station-view.fade { transition: opacity 0.25s ease; }

/* STATION TABS — at top, so it's clear they're "which station"
   pagination, not "next stops on the line". */
.station-tabs {
  display: flex;
  border-bottom: 4px solid var(--ink);
}
.station-tabs .tab {
  flex: 1;
  padding: 8px 14px;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(13px, 1.2vw, 17px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  border-right: 2px solid var(--ink);
  opacity: 0.45;
  transition: opacity 0.3s ease;
}
.station-tabs .tab:last-child { border-right: none; }
.station-tabs .tab.active {
  opacity: 1;
  background: var(--red);
  color: var(--paper);
}

/* STATION HEADER — L badge + station name + walk time */
.station-header {
  display: flex; justify-content: space-between; align-items: stretch;
  background: var(--ink);
  color: var(--paper);
  padding: 0;
  border-bottom: 4px solid var(--ink);
}
.station-header .L-badge {
  padding: 10px 14px;
  background: var(--ink);
  color: var(--paper);
  display: flex; align-items: center; gap: 10px;
  border-right: 4px solid var(--red);
}
.station-header .L-badge .circle {
  width: 46px; height: 46px; border-radius: 50%;
  background: #a7a9ac;    /* default MTA L-line grey */
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Alfa Slab One', serif;
  font-size: 28px;
  line-height: 1;
}
.station-header .L-badge .circle.line-L { background: #a7a9ac; }  /* MTA L grey */
.station-header .L-badge .circle.line-G { background: #6cbe45; }  /* MTA G lime green */
.station-header .L-badge .lbl {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 600;
  opacity: 0.7;
  line-height: 1.1;
  max-width: 70px;
}
.station-header .name {
  padding: 14px 22px;
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(36px, 4vw, 60px);
  line-height: 1;
  letter-spacing: -0.01em;
  flex: 1;
  text-transform: uppercase;
  display: flex; align-items: center;
}
.station-header .walk {
  padding: 14px 22px;
  background: var(--red);
  color: var(--paper);
  display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
  gap: 2px;
  min-width: 140px;
}
.station-header .walk .k {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  font-weight: 500; opacity: 0.85;
}
.station-header .walk .v {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(26px, 2.4vw, 38px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.dirs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  flex: 1;
  min-height: 0;
}
.dir {
  display: flex; flex-direction: column;
  padding: 16px 22px 14px;
  min-height: 0;
  gap: 8px;
}
.dir + .dir { border-left: 3px solid var(--ink); }
.dir .dir-label {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(14px, 1.3vw, 20px);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--red);
  padding-bottom: 6px;
  border-bottom: 2px solid var(--ink);
  line-height: 1.15;
  display: flex; align-items: baseline; gap: 8px;
}
.dir .dir-label .arrow {
  font-family: 'Alfa Slab One', serif;
  font-size: 1.2em;
  line-height: 1;
}
.dir .dir-label .terminus {
  font-family: 'Roboto Mono', monospace;
  font-size: 0.55em;
  letter-spacing: 0.18em;
  color: var(--ink);
  opacity: 0.55;
  font-weight: 500;
}
.dir .train-list {
  display: flex; flex-direction: column; gap: 2px;
  flex: 1;
}
.train-row {
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: baseline;
  gap: 10px;
  padding: 5px 10px;
}
.train-row .clock {
  font-family: 'Alfa Slab One', serif;
  font-size: clamp(18px, 1.9vw, 28px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.train-row .mins {
  font-family: 'Roboto Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  opacity: 0.55;
}
.train-row .tag {
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  font-size: clamp(12px, 1.15vw, 17px);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: right;
  opacity: 0.7;
  white-space: nowrap;
}
.train-row.missed { opacity: 0.35; }
.train-row.missed .tag { color: var(--red); font-weight: 700; opacity: 1; }
.train-row.catch {
  background: var(--red);
  color: var(--paper);
  padding: 10px 12px;
  gap: 14px;
  margin: 4px 0;
}
.train-row.catch .clock {
  font-size: clamp(26px, 2.8vw, 40px);
}
.train-row.catch .mins { color: var(--paper); opacity: 0.82; font-size: 12px; }
.train-row.catch .tag {
  font-size: clamp(15px, 1.5vw, 22px);
  font-weight: 700;
  opacity: 1;
}

/* Weather-rotation progress indicator — tiny bar below top strip
   so viewer knows the weather slot is rotating. */
.wx-progress {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: transparent;
  pointer-events: none;
}
.wx-progress .fill {
  height: 100%;
  background: var(--red);
  transition: width 0.3s linear;
}

/* ══════════════════════════════════════════════════════════════
   FOOTER — date + sun info + live status
   ══════════════════════════════════════════════════════════════ */
.footer {
  display: flex; align-items: stretch;
  border: 3px solid var(--ink);
}
.footer .cell {
  flex: 1;
  padding: 8px 14px;
  display: flex; align-items: center; gap: 12px;
  border-right: 3px solid var(--ink);
  min-width: 0;
}
.footer .cell:last-child { border-right: none; }
.footer .cell.inv { background: var(--ink); color: var(--paper); }
.footer .cell.red { background: var(--red); color: var(--paper); }
.footer .cell .k {
  font-family: 'Roboto Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.6;
  font-weight: 500;
  white-space: nowrap;
}
.footer .cell .v {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: clamp(14px, 1.4vw, 20px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.footer .live-dot {
  display: inline-block;
  width: 10px; height: 10px;
  background: var(--paper);
  animation: blink 1.6s steps(2, start) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0.25 } }

/* legacy compat */
.legacy { display: none; }
</style>
</head>
<body>

<div class="frame">

  <!-- ═════ TOP STRIP ═════ -->
  <div class="top">
    <div class="time-box">
      <span class="nums"><span id="bigClock">—</span></span>
      <span class="ampm" id="ampm">—</span>
    </div>
    <div class="wx-box" id="wxBox">
      <div class="temp-col">
        <div class="temp"><span id="tempNow">—</span><span class="deg">°</span></div>
        <div class="temp-c" id="tempC">—</div>
      </div>
      <div class="caption">
        <div class="day-label" id="wxDayLabel">NOW</div>
        <div class="label" id="weatherDesc">LOADING…</div>

<script>
// ═════════════════════════════════════════════════════════════════
// CONFIG — walk times from 617 Humboldt St
// ═════════════════════════════════════════════════════════════════
const WALK_MIN = {
  'Nassau Av':  9,
  'Graham Av':  12,
  'Bedford Av': 20,
};
const STATION_ORDER = ['Nassau Av', 'Graham Av', 'Bedford Av'];
const STATION_ROTATE_MS = 10_000;   // 10 seconds per station (user request)
const SLOGAN_ROTATE_MS  = 12_000;   // 12 seconds per slogan
const ALERT_ROTATE_MS   = 12_000;   // 12 seconds between alerts

// ═════════════════════════════════════════════════════════════════
// SAFE DOM
// ═════════════════════════════════════════════════════════════════
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}
function fahrToCelsius(f) { return (f - 32) * 5/9; }

// ═════════════════════════════════════════════════════════════════
// CLOCK + date
// ═════════════════════════════════════════════════════════════════
function fmtClockShort(date) {
  let h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + m + ap.toLowerCase();
}
function tickClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const mm = String(m).padStart(2, '0');
  document.getElementById('bigClock').textContent = h + ':' + mm;
  document.getElementById('ampm').textContent = ampm;
  document.getElementById('seconds').textContent = String(now.getSeconds()).padStart(2,'0');

  const weekday = now.toLocaleDateString('en-US', { weekday: 'short' });
  const md = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  document.getElementById('dateLabel').textContent = weekday + ' · ' + md;
}
tickClock();
setInterval(tickClock, 1000);

// ═════════════════════════════════════════════════════════════════
// WEATHER labels + advice
// ═════════════════════════════════════════════════════════════════
const WMO_LABEL = {
  0:'CLEAR', 1:'MOSTLY CLEAR', 2:'PARTLY CLOUDY', 3:'OVERCAST',
  45:'FOG', 48:'FREEZING FOG',
  51:'LIGHT DRIZZLE', 53:'DRIZZLE', 55:'HEAVY DRIZZLE',
  61:'LIGHT RAIN', 63:'RAIN', 65:'HEAVY RAIN',
  71:'LIGHT SNOW', 73:'SNOW', 75:'HEAVY SNOW', 77:'SNOW GRAINS',
  80:'RAIN SHOWERS', 81:'HEAVY SHOWERS', 82:'VIOLENT SHOWERS',
  85:'SNOW SHOWERS', 86:'HEAVY SNOW SHOWERS',
  95:'THUNDERSTORM', 96:'THUNDERSTORM + HAIL', 99:'SEVERE STORM',
};
function weatherSummary(code, tempF) {
  if ([95,96,99].includes(code)) return 'Thunderstorms possible. Stay inside if you can.';
  if ([65,82].includes(code))    return 'Heavy rain — full umbrella and jacket.';
  if ([61,63,80,81].includes(code)) return 'Rain on and off. Grab an umbrella.';
  if ([51,53,55].includes(code)) return 'Light drizzle. A hood should handle it.';
  if ([71,73,75,77,85,86].includes(code)) return 'Snow. Boots and extra time.';
  if ([45,48].includes(code))    return 'Foggy. Walk carefully.';
  if (code === 3)                return 'Overcast but dry. A sweater is enough.';
  if (code === 2)                return 'Partly cloudy. Mix of sun and shade.';
  if (code === 1)                return 'Mostly sunny. Easy day to be outside.';
  if (tempF >= 85) return 'Clear and hot. Sunscreen, hat, carry water.';
  if (tempF >= 70) return 'Clear and comfortable. Great day to be outside.';
  if (tempF >= 55) return 'Clear and mild. A light layer is plenty.';
  if (tempF >= 40) return 'Clear but cool. A jacket is a good idea.';
  return 'Clear and cold. Heavy coat and gloves.';
}

function uvLevel(v) {
  if (v == null) return { key: 'low', label: 'N/A', warn: '' };
  if (v < 3)  return { key: 'low',   label: 'Low',       warn: 'No protection needed' };
  if (v < 6)  return { key: 'mod',   label: 'Moderate',  warn: 'Sunscreen if outside >1 hr' };
  if (v < 8)  return { key: 'high',  label: 'High',      warn: 'Cover up · sunscreen + hat' };
  if (v < 11) return { key: 'vhigh', label: 'Very High', warn: 'Avoid sun 10a-4p · SPF 30+' };
  return        { key: 'extrm', label: 'Extreme',   warn: 'Stay inside if possible' };
}

function hoursMinutesBetween(a, b) {
  const totalMin = Math.abs(Math.round((b - a) / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return m + ' MIN';
  if (m === 0) return h + ' HR';
  return h + 'H ' + m + 'M';
}

// ═════════════════════════════════════════════════════════════════
// WEATHER STATE
// Top strip always shows CURRENT weather. 7-day strip below it shows
// the week's outlook. No rotation in the top strip — today's weather
// is always visible, as requested.
// ═════════════════════════════════════════════════════════════════
let weatherData = null;

// UV always shows the PRESENT value. The warning line mentions the
// daily peak if it's meaningfully higher — informational, not a label swap.
function setUVNow(value, peakHint) {
  const uv = uvLevel(value);
  const box = document.getElementById('uvBox');
  box.classList.remove('low','mod','high','vhigh','extrm');
  box.classList.add(uv.key);

  const kNode = document.querySelector('#uvBox .k');
  if (kNode) kNode.textContent = 'UV Now';

  document.getElementById('uvValue').textContent = (value == null ? '—' : Math.round(value));
  document.getElementById('uvLabel').textContent = uv.label;

  document.getElementById('uvWarn').textContent =
    peakHint ? uv.warn + ' · ' + peakHint : uv.warn;
}

// Renders CURRENT weather into the top strip.
function renderCurrentWeather() {
  if (!weatherData) return;
  const d = weatherData;
  const cur = d.current;
  const code = cur.weather_code;
  const tempF = cur.temperature_2m;

  const now = new Date();
  const weekday = now.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
  const md = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
  document.getElementById('wxDayLabel').textContent = 'NOW · ' + weekday + ' · ' + md;
  document.getElementById('tempNow').textContent = Math.round(tempF);
  document.getElementById('tempC').textContent = Math.round(fahrToCelsius(tempF)) + '°C';
  document.getElementById('weatherDesc').textContent = WMO_LABEL[code] || 'WEATHER';

  const parts = ['Feels ' + Math.round(cur.apparent_temperature) + '°F / ' +
                 Math.round(fahrToCelsius(cur.apparent_temperature)) + '°C'];
  if (cur.wind_speed_10m != null) parts.push(Math.round(cur.wind_speed_10m) + ' mph wind');
  if (cur.relative_humidity_2m != null) parts.push(cur.relative_humidity_2m + '% humidity');
  document.getElementById('feelsLike').textContent = parts.join(' · ');
  document.getElementById('weatherAdvice').textContent = weatherSummary(code, tempF);

  // UV: present-moment only. If today's peak is meaningfully higher
  // than right now (and still in the future today), include a small
  // informational hint — but the label always stays "UV Now".
  const nowUV = cur.uv_index;
  let peakHint = null;
  if (d.hourly && d.hourly.uv_index && d.hourly.time) {
    const nowMs = Date.now();
    let futurePeakVal = -1, futurePeakHour = null;
    for (let i = 0; i < d.hourly.time.length && i < 24; i++) {
      const ts = new Date(d.hourly.time[i]).getTime();
      if (ts <= nowMs) continue;  // only future hours
      const v = d.hourly.uv_index[i];
      if (v > futurePeakVal) { futurePeakVal = v; futurePeakHour = d.hourly.time[i]; }
    }
    if (futurePeakHour && futurePeakVal >= (nowUV || 0) + 2) {
      const pd = new Date(futurePeakHour);
      let ph = pd.getHours();
      const pap = ph >= 12 ? 'pm' : 'am';
      ph = ph % 12 || 12;
      peakHint = 'Peaks at UV ' + Math.round(futurePeakVal) + ' ~' + ph + pap;
    }
  }
  setUVNow(nowUV, peakHint);
}

// Renders the static 7-day forecast strip.
function renderForecastWeek() {
  if (!weatherData) return;
  const daily = weatherData.daily;
  if (!daily || !daily.time) return;
  const host = document.getElementById('forecastWeek');
  // Remove any existing day cells (keep .fw-label header)
  [...host.querySelectorAll('.fw-cell')].forEach(n => n.remove());

  const count = Math.min(daily.time.length, 7);
  for (let k = 0; k < count; k++) {
    const date = new Date(daily.time[k] + 'T12:00:00');
    const day = date.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
    const md  = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
    const hi = Math.round(daily.temperature_2m_max[k]);
    const lo = Math.round(daily.temperature_2m_min[k]);
    const code = daily.weather_code[k];
    const precip = daily.precipitation_probability_max?.[k] ?? 0;

    const cell = el('div', 'fw-cell');
    cell.appendChild(el('div', 'day', (k === 0 ? 'TODAY' : day)));
    cell.appendChild(el('div', 'date', md));
    const temps = el('div', 'temps');
    const hiEl = el('span', 'hi', hi + '°');
    const loEl = el('span', 'lo', lo + '°');
    temps.appendChild(hiEl);
    temps.appendChild(loEl);
    cell.appendChild(temps);
    cell.appendChild(el('div', 'cond', (WMO_LABEL[code] || 'Weather').split(' ')[0]));
    if (precip > 10) {
      cell.appendChild(el('div', 'precip', precip + '%'));
    } else {
      cell.appendChild(el('div', 'precip', ''));
    }
    host.appendChild(cell);
  }
}

async function refreshWeather() {
  try {
    const r = await fetch('/api/weather');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    weatherData = j.data;

    // Sunrise / sunset — always based on today (daily[0])
    const daily = weatherData.daily;
    if (daily && daily.sunrise && daily.sunset) {
      const sunrise = new Date(daily.sunrise[0]);
      const sunset  = new Date(daily.sunset[0]);
      document.getElementById('sunrise').textContent = fmtClockShort(sunrise);
      document.getElementById('sunset').textContent  = fmtClockShort(sunset);
      const now = new Date();
      if (now < sunrise) {
        document.getElementById('sunDirLabel').textContent = 'Until Sunrise';
        document.getElementById('sunDaylight').textContent = hoursMinutesBetween(now, sunrise);
      } else if (now < sunset) {
        document.getElementById('sunDirLabel').textContent = 'Until Sunset';
        document.getElementById('sunDaylight').textContent = hoursMinutesBetween(now, sunset);
      } else {
        const nextRise = daily.sunrise[1] ? new Date(daily.sunrise[1]) : null;
        document.getElementById('sunDirLabel').textContent = 'Until Sunrise';
        document.getElementById('sunDaylight').textContent = nextRise ? hoursMinutesBetween(now, nextRise) : '—';
      }
    }

    renderCurrentWeather();
    renderForecastWeek();
  } catch (e) {
    console.warn('weather', e);
    document.getElementById('weatherDesc').textContent = 'OFFLINE';
  }
}
refreshWeather();
// Current weather refreshes every 10 minutes (Open-Meteo caches anyway)
setInterval(refreshWeather, 10 * 60 * 1000);
// Re-render current weather every minute to keep "feels like" and
// the UV peak-hint current as the hour rolls over.
setInterval(() => { if (weatherData) renderCurrentWeather(); }, 60 * 1000);

// ═════════════════════════════════════════════════════════════════
// TRAIN DATA + ROTATING STATION VIEW
// ═════════════════════════════════════════════════════════════════
let trainsData = null;
let stationIdx = 0;

function buildTrainRow(mins, walk, isCatch) {
  const arriveAt = new Date(Date.now() + mins * 60_000);
  const leaveIn = mins - walk;
  const row = el('div', 'train-row');
  let tag;
  if (isCatch) {
    row.classList.add('catch');
    tag = (leaveIn <= 0) ? 'LEAVE NOW' : 'LEAVE IN ' + leaveIn + ' MIN';
  } else if (leaveIn < 1) {
    row.classList.add('missed');
    tag = 'MISSED';
  } else {
    tag = 'Leave in ' + leaveIn + ' min';
  }
  row.appendChild(el('span', 'clock', fmtClockShort(arriveAt)));
  row.appendChild(el('span', 'mins', '+' + mins + ' MIN'));
  row.appendChild(el('span', 'tag', tag));
  return row;
}
function fillDirection(hostId, trains, walk) {
  const host = document.getElementById(hostId);
  host.textContent = '';
  const arr = (trains || []).slice(0, 5);
  if (!arr.length) {
    const empty = el('div', 'train-row');
    empty.appendChild(el('span', 'tag', 'NO TRAINS SCHEDULED'));
    host.appendChild(empty);
    return;
  }
  const catchIdx = arr.findIndex(m => m >= walk + 1);
  arr.forEach((m, i) => host.appendChild(buildTrainRow(m, walk, i === catchIdx)));
  if (catchIdx === -1) {
    const note = el('div', 'train-row missed');
    note.appendChild(el('span', 'tag', 'ALL TOO CLOSE — CHECK BACK'));
    host.appendChild(note);
  }
}

function renderStationTabs() {
  const tabs = document.getElementById('stationTabs');
  tabs.textContent = '';
  STATION_ORDER.forEach((name, i) => {
    const t = el('div', 'tab' + (i === stationIdx ? ' active' : ''));
    t.textContent = name.toUpperCase();
    tabs.appendChild(t);
  });
}

// Friendly full-name labels for each line (shown next to the circle badge).
const LINE_LABELS = {
  L: 'L Train · 14 St–Canarsie',
  G: 'G Train · Brooklyn–Queens Xtown',
};

function showStation() {
  if (!trainsData) return;
  const name = STATION_ORDER[stationIdx];
  const s = (trainsData.stations || []).find(x => x.name === name);
  if (!s) return;

  const view = document.getElementById('stationView');
  view.classList.add('fade');
  setTimeout(() => {
    document.getElementById('stationName').textContent = name.toUpperCase();
    document.getElementById('stationWalk').textContent = WALK_MIN[name];

    // Line badge — correct color + full label per line
    const circle = document.getElementById('lineCircle');
    circle.textContent = s.line;
    circle.classList.remove('line-L', 'line-G');
    circle.classList.add('line-' + s.line);
    document.getElementById('lineLabel').textContent = LINE_LABELS[s.line] || (s.line + ' Train');

    // Direction labels — driven by data so G stations don't get L labels
    const dN = s.directions?.N || {};
    const dS = s.directions?.S || {};
    document.getElementById('dirN_label').textContent = (dN.label || '').toUpperCase();
    document.getElementById('dirN_term').textContent  = (dN.terminus || '').toUpperCase();
    document.getElementById('dirS_label').textContent = (dS.label || '').toUpperCase();
    document.getElementById('dirS_term').textContent  = (dS.terminus || '').toUpperCase();

    fillDirection('trainsN', dN.trains || [], WALK_MIN[name]);
    fillDirection('trainsS', dS.trains || [], WALK_MIN[name]);
    renderStationTabs();
    view.classList.remove('fade');
  }, 200);
}

function rotateStation() {
  stationIdx = (stationIdx + 1) % STATION_ORDER.length;
  showStation();
}

async function refreshTrains() {
  try {
    const r = await fetch('/api/trains');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    trainsData = j.data;

    // Alerts
    renderAlerts(trainsData.alerts || []);

    // Re-render currently-shown station with fresh numbers
    if (trainsData.stations && trainsData.stations.length) {
      if (stationIdx >= trainsData.stations.length) stationIdx = 0;
      showStation();
    }

    document.getElementById('statusRight').textContent = 'LIVE';
    document.getElementById('trainsUpdated').textContent = fmtClockShort(new Date());
  } catch (e) {
    console.warn('trains', e);
    document.getElementById('statusRight').textContent = 'RETRY';
  }
}
refreshTrains();
setInterval(refreshTrains, 20 * 1000);
setInterval(rotateStation, STATION_ROTATE_MS);

// ═════════════════════════════════════════════════════════════════
// MTA ALERTS — rotating ribbon
// ═════════════════════════════════════════════════════════════════
let alertList = [];
let alertIdx = 0;
function renderAlerts(alerts) {
  alertList = alerts || [];
  const rib = document.getElementById('alertRibbon');
  if (!alertList.length) {
    rib.classList.remove('visible');
    return;
  }
  rib.classList.add('visible');
  alertIdx = alertIdx % alertList.length;
  document.getElementById('alertBody').textContent = alertList[alertIdx].header;
}
function rotateAlert() {
  if (!alertList.length) return;
  alertIdx = (alertIdx + 1) % alertList.length;
  document.getElementById('alertBody').textContent = alertList[alertIdx].header;
}
setInterval(rotateAlert, ALERT_ROTATE_MS);

let sloganIdx = Math.floor(Math.random() * SLOGANS.length);
function rotateSlogan() {
  const node = document.getElementById('sloganText');
  if (!node) return;
  let next;
  do { next = Math.floor(Math.random() * SLOGANS.length); }
  while (SLOGANS.length > 1 && next === sloganIdx);
  sloganIdx = next;
  const s = SLOGANS[sloganIdx];

  node.classList.add('fade');
  setTimeout(() => {
    node.textContent = '';
    const body = document.createElement('span');
    body.className = 'quote-body';
    body.textContent = s.t.toUpperCase();
    node.appendChild(body);
    if (s.a) {
      const a = document.createElement('span');
      a.className = 'attr';
      a.textContent = '— ' + s.a.toUpperCase();
      node.appendChild(a);
    }
    node.classList.remove('fade');
  }, 400);
}
rotateSlogan();
setInterval(rotateSlogan, SLOGAN_ROTATE_MS);
