<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ГРИНПОЙНТ</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Dashboard"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,0..100;1,9..144,500..700,0..100&family=PT+Mono&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
<style>
/* ──────────────────────────────────────────────────────────────────
   Wall dashboard v5 — "Direction C"
   Soviet-editorial aesthetic, but every panel is intentionally sparse
   so type can get huge. One station fills the whole middle; the 7-day
   forecast lives on its own rotating screen.
   ────────────────────────────────────────────────────────────────── */
:root {
  --paper:   #f3e8cd;
  --paper-2: #e5d8b6;
  --ink:     #0a0a0a;
  --muted:   #7a7365;
  --hair:    rgba(10,10,10,0.18);
  --red:     #c4201e;
  --red-2:   #8a1513;
  --ochre:   #d4a017;

  --uv-low:    #2e7d32;
  --uv-mod:    #d4a017;
  --uv-high:   #e65100;
  --uv-vhigh:  #c4201e;
  --uv-extrm:  #6a1b9a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'PT Sans', Arial, sans-serif;
  font-size: 20px;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 70% 10%, rgba(0,0,0,0.04), transparent 60%),
    radial-gradient(ellipse at 10% 90%, rgba(196, 32, 30, 0.06), transparent 55%);
}
.frame {
  display: grid;
  grid-template-rows: auto auto auto 1fr auto auto;
  height: 100vh;
  padding: 18px 28px;
  gap: 14px;
}
.top           { grid-row: 1; }
.alert-ribbon  { grid-row: 2; }
.slogan-bar    { grid-row: 3; }
.carousel      { grid-row: 4; }
.carousel-tabs { grid-row: 5; }
.footer        { grid-row: 6; }

/* ══════════════════════════════════════════════════════════════
   TOP STRIP — time, current weather, UV NOW (always visible)
   ══════════════════════════════════════════════════════════════ */
.top {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: stretch;
  border: 3px solid var(--ink);
  background: var(--paper);
}
.time-box {
  background: var(--red);
  color: var(--paper);
  padding: 10px 28px 14px;
  display: flex; align-items: baseline; gap: 18px;
}
.time-box .nums {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(76px, 8vw, 140px);
  line-height: 0.92;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.time-box .ampm {
  font-family: 'PT Sans', Arial, sans-serif;
  font-weight: 700;
  font-size: clamp(22px, 2vw, 32px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.9;
}
.wx-box {
  background: var(--ink);
  color: var(--paper);
  padding: 12px 26px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: center;
  min-width: 0;
}
.wx-box .temp-col { display: flex; flex-direction: column; align-items: center; }
.wx-box .temp {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(60px, 6.8vw, 110px);
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: flex-start;
}
.wx-box .temp .deg { color: var(--red); font-size: 0.78em; }
.wx-box .temp-c {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(13px, 1.1vw, 16px);
  letter-spacing: 0.06em;
  opacity: 0.75;
  margin-top: -6px;
}
.wx-box .caption { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.wx-box .caption .day-label {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(11px, 1vw, 14px);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ochre);
  font-weight: 700;
  line-height: 1;
}
.wx-box .caption .label {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(26px, 2.6vw, 42px);
  line-height: 1.02;
}
.wx-box .caption .sub {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(12px, 1.05vw, 15px);
  letter-spacing: 0.06em;
  opacity: 0.8;
}
.wx-box .caption .advice {
  font-family: 'PT Sans', Arial, sans-serif;
  font-weight: 500;
  font-size: clamp(15px, 1.3vw, 20px);
  line-height: 1.25;
  opacity: 0.92;
  max-width: 52ch;
}
.uv-box {
  padding: 10px 20px;
  min-width: 150px;
  background: var(--paper);
  border-left: 3px solid var(--ink);
  display: flex; flex-direction: column; justify-content: center;
  gap: 4px;
  color: var(--ink);
}
.uv-box .k {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: 12px; letter-spacing: 0.22em;
  text-transform: uppercase; font-weight: 700; opacity: 0.7;
}
.uv-box .v {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(40px, 3.4vw, 54px);
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
}
.uv-box .l {
  font-family: 'PT Sans', Arial, sans-serif; font-weight: 700;
  font-size: 14px; letter-spacing: 0.14em;
  text-transform: uppercase; padding: 3px 8px;
  color: var(--paper); align-self: flex-start;
}
.uv-box.low   .l { background: var(--uv-low); }
.uv-box.mod   .l { background: var(--uv-mod); color: var(--ink); }
.uv-box.high  .l { background: var(--uv-high); }
.uv-box.vhigh .l { background: var(--uv-vhigh); }
.uv-box.extrm .l { background: var(--uv-extrm); }
.uv-box.high, .uv-box.vhigh, .uv-box.extrm { background: var(--paper-2); }
.uv-box .warn {
  font-family: 'PT Sans', Arial, sans-serif;
  font-size: 12px; letter-spacing: 0.05em;
  font-weight: 500; line-height: 1.25;
  opacity: 0.8; margin-top: 2px;
  max-width: 150px;
}

/* ══════════════════════════════════════════════════════════════
   ALERT RIBBON
   ══════════════════════════════════════════════════════════════ */
.alert-ribbon {
  display: none;
  align-items: center; gap: 14px;
  padding: 10px 20px;
  background: var(--red); color: var(--paper);
  border: 2px solid var(--red-2);
}
.alert-ribbon.visible { display: flex; }
.alert-ribbon .siren {
  width: 24px; height: 24px; flex: 0 0 auto;
  background: var(--paper);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2 C6 2 5 8 5 14 H3 V16 H21 V14 H19 C19 8 18 2 12 2 Z M11 18 H13 V22 H11 V18 Z' fill='black'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2 C6 2 5 8 5 14 H3 V16 H21 V14 H19 C19 8 18 2 12 2 Z M11 18 H13 V22 H11 V18 Z' fill='black'/></svg>") center / contain no-repeat;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
.alert-ribbon .label {
  font-family: 'PT Sans', Arial, sans-serif; font-weight: 700;
  font-size: 16px; letter-spacing: 0.18em;
  text-transform: uppercase; flex: 0 0 auto;
  padding-right: 14px; border-right: 2px solid rgba(255,255,255,0.4);
}
.alert-ribbon .body {
  font-family: 'PT Sans', Arial, sans-serif; font-weight: 500;
  font-size: clamp(14px, 1.2vw, 18px);
  line-height: 1.25; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis;
}

/* ══════════════════════════════════════════════════════════════
   SLOGAN BAR — Lenin + Fraunces pull-quote
   ══════════════════════════════════════════════════════════════ */
.slogan-bar {
  display: flex; align-items: center; gap: 22px;
  padding: 16px 24px;
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--ink);
}
.slogan-bar .lenin {
  flex: 0 0 auto; width: 78px; height: 92px;
  background-color: var(--red);
  -webkit-mask: url('/assets/lenin.svg') no-repeat center / contain;
          mask: url('/assets/lenin.svg') no-repeat center / contain;
}
.slogan-bar .star {
  flex: 0 0 auto; width: 40px; height: 40px; color: var(--red);
}
.slogan-bar .slogan-text {
  font-family: 'Fraunces', 'PT Serif', Georgia, serif;
  font-weight: 500;
  /* 3× the previous 17-23px range → 51-69px */
  font-size: clamp(51px, 4.65vw, 69px);
  font-variation-settings: "opsz" 120, "SOFT" 50;
  line-height: 1.1;
  color: var(--ink);
  flex: 1; min-width: 0;
  transition: opacity 0.4s ease;
}
.slogan-bar .slogan-text.fade { opacity: 0; }
.slogan-bar .slogan-text .attr {
  display: block;
  margin-top: 8px;
  font-family: 'Fraunces', 'PT Serif', Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-variation-settings: "opsz" 60, "SOFT" 100;
  color: var(--red);
  margin-left: 0;
  font-size: 0.42em;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ══════════════════════════════════════════════════════════════
   CAROUSEL — 4 panels, absolute-stacked, one visible at a time
   ══════════════════════════════════════════════════════════════ */
.carousel {
  position: relative;
  min-height: 0;
  border: 3px solid var(--ink);
  background: var(--paper);
  overflow: hidden;
}
.panel {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
  display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
.panel.active { opacity: 1; pointer-events: auto; }

/* ── Station panel (shared by 3 station panels) ─────────────── */
.station-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  padding: 16px 28px;
  gap: 22px;
  border-bottom: 3px solid var(--ink);
  background: var(--paper);
}
.station-head .circle {
  width: 72px; height: 72px; border-radius: 50%;
  background: #a7a9ac; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: 'PT Serif', serif;
  font-weight: 700;
  font-size: 44px;
  line-height: 1;
}
.station-head .circle.line-L { background: #a7a9ac; }
.station-head .circle.line-G { background: #6cbe45; }
.station-head .name {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(44px, 4.6vw, 74px);
  line-height: 1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.station-head .walk {
  text-align: right;
}
.station-head .walk .k {
  display: block;
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  line-height: 1;
  margin-bottom: 4px;
}
.station-head .walk .v {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(34px, 3.2vw, 48px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--red);
}

/* Two direction blocks stacked vertically, each with 3 trains */
.dirs {
  flex: 1;
  display: grid;
  grid-template-rows: 1fr 1fr;
  min-height: 0;
}
.dir {
  display: flex; flex-direction: column;
  padding: 18px 34px 16px;
  min-height: 0;
  gap: 8px;
}
.dir + .dir { border-top: 3px solid var(--ink); background: var(--paper-2); }
.dir-label {
  display: flex; align-items: baseline; gap: 14px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--hair);
  font-family: 'PT Sans', Arial, sans-serif;
}
.dir-label .arrow {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(26px, 2.2vw, 34px);
  color: var(--red); line-height: 1;
}
.dir-label .main {
  font-weight: 700;
  font-size: clamp(22px, 2vw, 32px);
  letter-spacing: 0.02em;
  color: var(--ink);
  text-transform: uppercase;
}
.dir-label .terminus {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(12px, 1vw, 15px);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

.train-list {
  display: flex; flex-direction: column;
  flex: 1;
  justify-content: space-around;
  gap: 4px;
}
.train-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: baseline;
  gap: 20px;
  padding: 6px 4px;
}
.train-row .clock {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(30px, 3vw, 46px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.005em;
}
.train-row .mins {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(12px, 1vw, 15px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.train-row .tag {
  font-family: 'PT Sans', Arial, sans-serif;
  font-weight: 700;
  font-size: clamp(18px, 1.8vw, 26px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-align: right;
  color: var(--muted);
  white-space: nowrap;
}
.train-row.missed { opacity: 0.38; }
.train-row.missed .tag { color: var(--red); font-weight: 700; opacity: 1; }
.train-row.catch {
  background: var(--red);
  color: var(--paper);
  padding: 14px 16px;
  border-radius: 0;
}
.train-row.catch .clock {
  font-size: clamp(42px, 4.2vw, 64px);
  color: var(--paper);
}
.train-row.catch .mins { color: var(--paper); opacity: 0.82; }
.train-row.catch .tag {
  color: var(--paper);
  font-size: clamp(22px, 2.2vw, 34px);
  font-weight: 700;
  opacity: 1;
}

/* ── Weather panel (current + 7-day + sun) ──────────────────── */
.weather-panel {
  padding: 20px 28px 20px;
  overflow: hidden;
  display: flex; flex-direction: column;
  gap: 18px;
}
.wp-head {
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 3px solid var(--ink);
  padding-bottom: 10px;
}
.wp-head .title {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(38px, 3.6vw, 56px);
  line-height: 1;
}
.wp-head .title .cy { color: var(--red); margin-right: 18px; }
.wp-head .sub {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(14px, 1.2vw, 18px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.wp-summary {
  font-family: 'PT Sans', Arial, sans-serif;
  font-size: clamp(18px, 1.6vw, 24px);
  line-height: 1.35;
  color: var(--ink);
  max-width: 68ch;
}

/* 7-day row — all days in one horizontal strip, generous cells */
.wp-days {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  border: 3px solid var(--ink);
  background: var(--ink);
  min-height: 0;
}
.wp-day {
  background: var(--paper);
  color: var(--ink);
  padding: 14px 12px;
  border-right: 2px solid var(--ink);
  display: flex; flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.wp-day:last-child { border-right: none; }
.wp-day:nth-child(even) { background: var(--paper-2); }
.wp-day.today { background: var(--red); color: var(--paper); }
.wp-day .dow {
  font-family: 'PT Sans', Arial, sans-serif;
  font-weight: 700;
  font-size: clamp(18px, 1.7vw, 24px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1;
}
.wp-day .date {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(11px, 0.9vw, 13px);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.65;
  font-weight: 700;
  line-height: 1;
}
.wp-day .t {
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  font-weight: 700;
  font-size: clamp(30px, 3vw, 44px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}
.wp-day .t .lo { opacity: 0.5; font-size: 0.62em; margin-left: 6px; }
.wp-day .cond {
  font-family: 'PT Sans', Arial, sans-serif;
  font-weight: 700;
  font-size: clamp(13px, 1.15vw, 17px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.2;
  margin-top: auto;
}
.wp-day .precip {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(12px, 1vw, 15px);
  font-weight: 700;
  color: var(--red);
  letter-spacing: 0.04em;
}
.wp-day.today .precip,
.wp-day:nth-child(even) .precip { color: var(--ochre); }

/* Sun strip at the bottom of the weather panel */
.wp-sun {
  display: flex; gap: 26px; flex-wrap: wrap;
  align-items: baseline;
  padding: 10px 4px 0;
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: clamp(14px, 1.2vw, 18px);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.wp-sun .k { font-weight: 700; color: var(--muted); opacity: 0.65; }
.wp-sun .v {
  color: var(--ink); font-weight: 700;
  margin-left: 6px;
  font-family: 'PT Serif', 'Times New Roman', Georgia, serif;
  text-transform: none;
  letter-spacing: 0;
  font-size: 1.15em;
}
.wp-sun .item { display: inline-flex; align-items: baseline; }

/* ══════════════════════════════════════════════════════════════
   CAROUSEL TABS
   ══════════════════════════════════════════════════════════════ */
.carousel-tabs {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  border: 2px solid var(--ink);
}
.carousel-tabs .tab {
  padding: 10px 14px;
  background: var(--paper);
  color: var(--ink);
  font-family: 'PT Sans', Arial, sans-serif;
  font-weight: 700;
  font-size: clamp(13px, 1.15vw, 17px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-align: center;
  border-right: 2px solid var(--ink);
  opacity: 0.42;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  line-height: 1.1;
}
.carousel-tabs .tab:last-child { border-right: none; }
.carousel-tabs .tab .sub {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  opacity: 0.7;
  font-weight: 700;
}
.carousel-tabs .tab.active {
  opacity: 1;
  background: var(--red);
  color: var(--paper);
}

/* ══════════════════════════════════════════════════════════════
   FOOTER — date + sun info + live
   ══════════════════════════════════════════════════════════════ */
.footer {
  display: flex; align-items: stretch;
  border: 2px solid var(--ink);
}
.footer .cell {
  flex: 1;
  padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
  border-right: 2px solid var(--ink);
  min-width: 0;
}
.footer .cell:last-child { border-right: none; }
.footer .cell.inv { background: var(--ink); color: var(--paper); }
.footer .cell.red { background: var(--red); color: var(--paper); }
.footer .cell .k {
  font-family: 'PT Mono', ui-monospace, monospace;
  font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; opacity: 0.65; font-weight: 700;
}
.footer .cell .v {
  font-family: 'PT Sans', Arial, sans-serif;
  font-weight: 700;
  font-size: clamp(16px, 1.5vw, 22px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.footer .live-dot {
  display: inline-block;
  width: 10px; height: 10px;
  background: var(--paper);
  animation: blink 1.6s steps(2, start) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0.25 } }

.legacy { display: none; }

<script>
// ═════════════════════════════════════════════════════════════════
// CONFIG
// ═════════════════════════════════════════════════════════════════
const WALK_MIN = {
  'Nassau Av':  9,
  'Graham Av':  12,
  'Bedford Av': 20,
};
const STATION_ORDER = ['Nassau Av', 'Graham Av', 'Bedford Av'];
const PANELS = [
  { id: 'panel-Nassau Av',  type: 'station', station: 'Nassau Av',  label: 'Nassau',  sub: 'G · 1 of 4' },
  { id: 'panel-Graham Av',  type: 'station', station: 'Graham Av',  label: 'Graham',  sub: 'L · 2 of 4' },
  { id: 'panel-Bedford Av', type: 'station', station: 'Bedford Av', label: 'Bedford', sub: 'L · 3 of 4' },
  { id: 'panel-weather',    type: 'weather', label: 'Weather',     sub: '7 days · 4 of 4' },
];
const PANEL_ROTATE_MS = 12_000;
const SLOGAN_ROTATE_MS = 12_000;
const ALERT_ROTATE_MS  = 12_000;
const TRAINS_PER_DIR = 3;

// ═════════════════════════════════════════════════════════════════
// SAFE DOM
// ═════════════════════════════════════════════════════════════════
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}
function fahrToCelsius(f) { return (f - 32) * 5/9; }
function fmtClockShort(date) {
  let h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
}
function hoursMinutesBetween(a, b) {
  const totalMin = Math.abs(Math.round((b - a) / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return m + ' min';
  if (m === 0) return h + ' hr';
  return h + ' hr ' + m + ' min';
}

// ═════════════════════════════════════════════════════════════════
// CLOCK
// ═════════════════════════════════════════════════════════════════
function tickClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const mm = String(m).padStart(2, '0');
  document.getElementById('bigClock').textContent = h + ':' + mm;
  document.getElementById('ampm').textContent = ampm;
  document.getElementById('seconds').textContent = String(now.getSeconds()).padStart(2,'0');

  const weekday = now.toLocaleDateString('en-US', { weekday: 'short' });
  const md = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  document.getElementById('dateLabel').textContent = weekday + ' · ' + md;
}
tickClock();
setInterval(tickClock, 1000);

// ═════════════════════════════════════════════════════════════════
// WEATHER
// ═════════════════════════════════════════════════════════════════
const WMO_LABEL = {
  0:'Clear', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
  45:'Fog', 48:'Freezing fog',
  51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
  61:'Light rain', 63:'Rain', 65:'Heavy rain',
  71:'Light snow', 73:'Snow', 75:'Heavy snow', 77:'Snow grains',
  80:'Rain showers', 81:'Heavy showers', 82:'Violent showers',
  85:'Snow showers', 86:'Heavy snow showers',
  95:'Thunderstorm', 96:'Thunderstorm + hail', 99:'Severe storm',
};
function weatherSummary(code, tempF) {
  if ([95,96,99].includes(code)) return 'Thunderstorms possible. Stay inside if you can.';
  if ([65,82].includes(code))    return 'Heavy rain — full umbrella and jacket.';
  if ([61,63,80,81].includes(code)) return 'Rain on and off. Grab an umbrella.';
  if ([51,53,55].includes(code)) return 'Light drizzle. A hood should handle it.';
  if ([71,73,75,77,85,86].includes(code)) return 'Snow. Boots and extra time.';
  if ([45,48].includes(code))    return 'Foggy. Walk carefully.';
  if (code === 3)                return 'Overcast but dry. A sweater is enough.';
  if (code === 2)                return 'Partly cloudy. Mix of sun and shade.';
  if (code === 1)                return 'Mostly sunny. Easy day to be outside.';
  if (tempF >= 85) return 'Clear and hot. Sunscreen, hat, carry water.';
  if (tempF >= 70) return 'Clear and comfortable. Great day to be outside.';
  if (tempF >= 55) return 'Clear and mild. A light layer is plenty.';
  if (tempF >= 40) return 'Clear but cool. A jacket is a good idea.';
  return 'Clear and cold. Heavy coat and gloves.';
}
function uvLevel(v) {
  if (v == null) return { key: 'low', label: 'N/A', warn: '' };
  if (v < 3)  return { key: 'low',   label: 'Low',       warn: 'No protection needed' };
  if (v < 6)  return { key: 'mod',   label: 'Moderate',  warn: 'Sunscreen if outside >1 hr' };
  if (v < 8)  return { key: 'high',  label: 'High',      warn: 'Cover up · sunscreen + hat' };
  if (v < 11) return { key: 'vhigh', label: 'Very High', warn: 'Avoid sun 10a-4p · SPF 30+' };
  return        { key: 'extrm', label: 'Extreme',   warn: 'Stay inside if possible' };
}

let weatherData = null;
function setUVNow(value, peakHint) {
  const uv = uvLevel(value);
  const box = document.getElementById('uvBox');
  box.classList.remove('low','mod','high','vhigh','extrm');
  box.classList.add(uv.key);
  document.getElementById('uvValue').textContent = (value == null ? '—' : Math.round(value));
  document.getElementById('uvLabel').textContent = uv.label;
  document.getElementById('uvWarn').textContent =
    peakHint ? uv.warn + ' · ' + peakHint : uv.warn;
}
function renderCurrentWeather() {
  if (!weatherData) return;
  const d = weatherData, cur = d.current;
  const code = cur.weather_code;
  const tempF = cur.temperature_2m;
  const now = new Date();
  const weekday = now.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
  const md = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
  document.getElementById('wxDayLabel').textContent = 'NOW · ' + weekday + ' · ' + md;
  document.getElementById('tempNow').textContent = Math.round(tempF);
  document.getElementById('tempC').textContent = Math.round(fahrToCelsius(tempF)) + '°C';
  document.getElementById('weatherDesc').textContent = WMO_LABEL[code] || 'Weather';

  const parts = ['Feels ' + Math.round(cur.apparent_temperature) + '°F / ' +
                 Math.round(fahrToCelsius(cur.apparent_temperature)) + '°C'];
  if (cur.wind_speed_10m != null) parts.push(Math.round(cur.wind_speed_10m) + ' mph wind');
  if (cur.relative_humidity_2m != null) parts.push(cur.relative_humidity_2m + '% humidity');
  document.getElementById('feelsLike').textContent = parts.join(' · ');
  document.getElementById('weatherAdvice').textContent = weatherSummary(code, tempF);

  const nowUV = cur.uv_index;
  let peakHint = null;
  if (d.hourly && d.hourly.uv_index && d.hourly.time) {
    const nowMs = Date.now();
    let futurePeakVal = -1, futurePeakHour = null;
    for (let i = 0; i < d.hourly.time.length && i < 24; i++) {
      const ts = new Date(d.hourly.time[i]).getTime();
      if (ts <= nowMs) continue;
      const v = d.hourly.uv_index[i];
      if (v > futurePeakVal) { futurePeakVal = v; futurePeakHour = d.hourly.time[i]; }
    }
    if (futurePeakHour && futurePeakVal >= (nowUV || 0) + 2) {
      const pd = new Date(futurePeakHour);
      let ph = pd.getHours();
      const pap = ph >= 12 ? 'pm' : 'am';
      ph = ph % 12 || 12;
      peakHint = 'Peaks at UV ' + Math.round(futurePeakVal) + ' ~' + ph + pap;
    }
  }
  setUVNow(nowUV, peakHint);
}
function renderSunInfo() {
  if (!weatherData) return;
  const daily = weatherData.daily;
  if (!daily || !daily.sunrise || !daily.sunset) return;
  const sunrise = new Date(daily.sunrise[0]);
  const sunset  = new Date(daily.sunset[0]);
  document.getElementById('sunrise').textContent = fmtClockShort(sunrise);
  document.getElementById('sunset').textContent  = fmtClockShort(sunset);
  const now = new Date();
  if (now < sunrise) {
    document.getElementById('sunDirLabel').textContent = 'Until Sunrise';
    document.getElementById('sunDaylight').textContent = hoursMinutesBetween(now, sunrise);
  } else if (now < sunset) {
    document.getElementById('sunDirLabel').textContent = 'Until Sunset';
    document.getElementById('sunDaylight').textContent = hoursMinutesBetween(now, sunset);
  } else {
    const nextRise = daily.sunrise[1] ? new Date(daily.sunrise[1]) : null;
    document.getElementById('sunDirLabel').textContent = 'Until Sunrise';
    document.getElementById('sunDaylight').textContent = nextRise ? hoursMinutesBetween(now, nextRise) : '—';
  }
}
function renderWeatherPanel() {
  if (!weatherData) return;
  const d = weatherData;
  const daily = d.daily;
  if (!daily || !daily.time) return;

  // Summary text = weatherAdvice (reuse)
  const tempF = d.current.temperature_2m;
  const code = d.current.weather_code;
  const summary = weatherSummary(code, tempF) + ' Hi ' +
    Math.round(daily.temperature_2m_max[0]) + '°F / Lo ' +
    Math.round(daily.temperature_2m_min[0]) + '°F today.';
  document.getElementById('wpSummary').textContent = summary;

  // Sub label in the header
  const subLabel = new Date(daily.time[0] + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase() +
    ' – ' + new Date(daily.time[Math.min(6, daily.time.length-1)] + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
  document.getElementById('wpSubLabel').textContent = subLabel;

  // Days grid
  const grid = document.getElementById('wpDays');
  grid.textContent = '';
  const count = Math.min(daily.time.length, 7);
  for (let k = 0; k < count; k++) {
    const date = new Date(daily.time[k] + 'T12:00:00');
    const dow = date.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
    const md  = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
    const hi = Math.round(daily.temperature_2m_max[k]);
    const lo = Math.round(daily.temperature_2m_min[k]);
    const dCode = daily.weather_code[k];
    const precip = daily.precipitation_probability_max?.[k] ?? 0;
    const cell = el('div', 'wp-day' + (k === 0 ? ' today' : ''));
    cell.appendChild(el('div', 'dow', (k === 0 ? 'TODAY' : dow)));
    cell.appendChild(el('div', 'date', md));
    const t = el('div', 't');
    t.appendChild(el('span', 'hi', hi + '°'));
    t.appendChild(el('span', 'lo', lo + '°'));
    cell.appendChild(t);
    cell.appendChild(el('div', 'cond', WMO_LABEL[dCode] || 'Weather'));
    if (precip > 10) cell.appendChild(el('div', 'precip', precip + '% rain'));
    grid.appendChild(cell);
  }

  // Sun strip
  if (daily.sunrise && daily.sunset) {
    const sr = new Date(daily.sunrise[0]);
    const ss = new Date(daily.sunset[0]);
    document.getElementById('wpSunrise').textContent = fmtClockShort(sr);
    document.getElementById('wpSunset').textContent  = fmtClockShort(ss);
    document.getElementById('wpDaylight').textContent = hoursMinutesBetween(sr, ss);
  }
  if (daily.uv_index_max) {
    const peak = Math.round(daily.uv_index_max[0]);
    let hAt = '', maxV = -1;
    if (d.hourly && d.hourly.uv_index) {
      for (let i = 0; i < Math.min(24, d.hourly.time.length); i++) {
        const v = d.hourly.uv_index[i];
        if (v > maxV) {
          maxV = v;
          const ht = new Date(d.hourly.time[i]);
          let hh = ht.getHours();
          const ap = hh >= 12 ? 'pm' : 'am';
          hh = hh % 12 || 12;
          hAt = ' ~' + hh + ap;
        }
      }
    }
    document.getElementById('wpPeakUV').textContent = peak + hAt;
  }
}
async function refreshWeather() {
  try {
    const r = await fetch('/api/weather');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    weatherData = j.data;
    renderCurrentWeather();
    renderSunInfo();
    renderWeatherPanel();
  } catch (e) {
    console.warn('weather', e);
    document.getElementById('weatherDesc').textContent = 'Offline';
  }
}
refreshWeather();
setInterval(refreshWeather, 10 * 60 * 1000);
setInterval(() => { if (weatherData) { renderCurrentWeather(); renderSunInfo(); }}, 60 * 1000);

// ═════════════════════════════════════════════════════════════════
// TRAINS
// ═════════════════════════════════════════════════════════════════
let trainsData = null;
function buildTrainRow(mins, walk, isCatch) {
  const arriveAt = new Date(Date.now() + mins * 60_000);
  const leaveIn = mins - walk;
  const row = el('div', 'train-row');
  let tag;
  if (isCatch) {
    row.classList.add('catch');
    tag = (leaveIn <= 0) ? 'LEAVE NOW' : 'LEAVE IN ' + leaveIn + ' MIN';
  } else if (leaveIn < 1) {
    row.classList.add('missed');
    tag = 'Missed';
  } else {
    tag = 'Leave in ' + leaveIn + ' min';
  }
  row.appendChild(el('span', 'clock', fmtClockShort(arriveAt)));
  row.appendChild(el('span', 'mins', '+' + mins + ' MIN'));
  row.appendChild(el('span', 'tag', tag));
  return row;
}
function fillDirEl(listEl, trains, walk) {
  listEl.textContent = '';
  const arr = (trains || []).slice(0, TRAINS_PER_DIR);
  if (!arr.length) {
    const empty = el('div', 'train-row');
    empty.appendChild(el('span', 'tag', 'No trains scheduled'));
    listEl.appendChild(empty);
    return;
  }
  const catchIdx = arr.findIndex(m => m >= walk + 1);
  arr.forEach((m, i) => listEl.appendChild(buildTrainRow(m, walk, i === catchIdx)));
  if (catchIdx === -1) {
    const note = el('div', 'train-row missed');
    note.appendChild(el('span', 'tag', 'All too close — check back'));
    listEl.appendChild(note);
  }
}
function renderStationPanel(stationName) {
  if (!trainsData) return;
  const s = (trainsData.stations || []).find(x => x.name === stationName);
  if (!s) return;
  const panel = document.getElementById('panel-' + stationName);
  if (!panel) return;
  const walk = WALK_MIN[stationName];
  const circle = panel.querySelector('[data-station-circle]');
  circle.textContent = s.line;
  circle.classList.remove('line-L', 'line-G');
  circle.classList.add('line-' + s.line);
  panel.querySelector('[data-station-name]').textContent = stationName;
  panel.querySelector('[data-station-walk]').textContent = walk + ' min';
  const dN = s.directions?.N || {}, dS = s.directions?.S || {};
  panel.querySelector('[data-dir-n-label]').textContent = dN.label || '—';
  panel.querySelector('[data-dir-n-term]').textContent  = (dN.terminus || '');
  panel.querySelector('[data-dir-s-label]').textContent = dS.label || '—';
  panel.querySelector('[data-dir-s-term]').textContent  = (dS.terminus || '');
  fillDirEl(panel.querySelector('[data-trains-n]'), dN.trains, walk);
  fillDirEl(panel.querySelector('[data-trains-s]'), dS.trains, walk);
}
async function refreshTrains() {
  try {
    const r = await fetch('/api/trains');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    trainsData = j.data;
    renderAlerts(trainsData.alerts || []);
    STATION_ORDER.forEach(renderStationPanel);
    document.getElementById('statusRight').textContent = 'LIVE';
  } catch (e) {
    console.warn('trains', e);
    document.getElementById('statusRight').textContent = 'RETRY';
  }
}
refreshTrains();
setInterval(refreshTrains, 20 * 1000);

// ═════════════════════════════════════════════════════════════════
// CAROUSEL ROTATION
// ═════════════════════════════════════════════════════════════════
let panelIdx = 0;
function renderCarouselTabs() {
  const host = document.getElementById('carouselTabs');
  host.textContent = '';
  PANELS.forEach((p, i) => {
    const t = el('div', 'tab' + (i === panelIdx ? ' active' : ''));
    t.appendChild(el('div', '', p.label));
    t.appendChild(el('div', 'sub', p.sub));
    host.appendChild(t);
  });
}
function showPanel(idx) {
  document.querySelectorAll('.carousel > .panel').forEach(p => p.classList.remove('active'));
  const p = PANELS[idx];
  const target = document.getElementById(p.id);
  if (target) target.classList.add('active');
  if (p.type === 'station') renderStationPanel(p.station);
  else if (p.type === 'weather') renderWeatherPanel();
  renderCarouselTabs();
}
showPanel(0);
setInterval(() => {
  // Skip rotation when CMS says paused or forces a specific panel
  if (_settings && _settings.paused) return;
  if (_settings && _settings.force_panel) return;
  panelIdx = (panelIdx + 1) % PANELS.length;
  showPanel(panelIdx);
}, PANEL_ROTATE_MS);

// ═════════════════════════════════════════════════════════════════
// AUTO-RELOAD — poll /api/version, reload when it changes.
// WORKER_VERSION is regenerated on every Worker cold-start, so a new
// deploy propagates to the wall display within ~30 seconds.
// ═════════════════════════════════════════════════════════════════
let _seenVersion = null;
async function checkVersion() {
  try {
    const r = await fetch('/api/version', { cache: 'no-cache' });
    const j = await r.json();
    if (_seenVersion && j.version !== _seenVersion) {
      console.log('Worker version changed, reloading…');
      location.reload();
      return;
    }
    _seenVersion = j.version;
  } catch (e) { /* offline, try again next tick */ }
}
checkVersion();
setInterval(checkVersion, 30_000);

// ═════════════════════════════════════════════════════════════════
// CMS SETTINGS — poll /api/settings, apply brightness/pause/etc.
// The /control page writes to the same endpoint.
// ═════════════════════════════════════════════════════════════════
let _settings = null;
async function pollSettings() {
  try {
    const r = await fetch('/api/settings', { cache: 'no-cache' });
    const j = await r.json();
    if (!j.ok) return;
    applySettings(j.data);
  } catch (e) { /* ignore transient failures */ }
}
function applySettings(s) {
  if (!s) return;
  const prev = _settings || {};
  _settings = s;

  // Force-reload when /control presses the "Reload Wall" button.
  // Token is a timestamp bumped on each press; on first poll we
  // just record whatever's there so existing deployments don't
  // reload themselves.
  if (prev.reload_token !== undefined &&
      s.reload_token !== undefined &&
      Number(s.reload_token) > Number(prev.reload_token || 0)) {
    console.log('Reload token bumped, reloading…');
    location.reload();
    return;
  }

  // Brightness: CSS filter on body (non-destructive)
  const b = Math.max(10, Math.min(100, Number(s.brightness ?? 100)));
  document.body.style.filter = 'brightness(' + b + '%)';

  // Show/hide slogan + footer
  const sloganBar = document.querySelector('.slogan-bar');
  if (sloganBar) sloganBar.style.display = (s.show_slogan === false) ? 'none' : '';
  const footer = document.querySelector('.footer');
  if (footer) footer.style.display = (s.show_footer === false) ? 'none' : '';

  // Dark mode
  document.body.classList.toggle('dark-mode', !!s.dark_mode);

  // Force-panel: if CMS pins a specific panel, jump to it
  if (s.force_panel && s.force_panel !== prev.force_panel) {
    let targetIdx = -1;
    if (s.force_panel === 'weather') {
      targetIdx = PANELS.findIndex(p => p.type === 'weather');
    } else {
      targetIdx = PANELS.findIndex(p => p.station === s.force_panel);
    }
    if (targetIdx >= 0) {
      panelIdx = targetIdx;
      showPanel(panelIdx);
    }
  }
}
pollSettings();
setInterval(pollSettings, 3_000);

// ═════════════════════════════════════════════════════════════════
// ALERTS
// ═════════════════════════════════════════════════════════════════
let alertList = [], alertIdx = 0;
function renderAlerts(alerts) {
  alertList = alerts || [];
  const rib = document.getElementById('alertRibbon');
  if (!alertList.length) { rib.classList.remove('visible'); return; }
  rib.classList.add('visible');
  alertIdx = alertIdx % alertList.length;
  document.getElementById('alertBody').textContent = alertList[alertIdx].header;
}
function rotateAlert() {
  if (!alertList.length) return;
  alertIdx = (alertIdx + 1) % alertList.length;
  document.getElementById('alertBody').textContent = alertList[alertIdx].header;
}
setInterval(rotateAlert, ALERT_ROTATE_MS);

let sloganIdx = Math.floor(Math.random() * SLOGANS.length);
function rotateSlogan() {
  const node = document.getElementById('sloganText');
  if (!node) return;
  let next;
  do { next = Math.floor(Math.random() * SLOGANS.length); }
  while (SLOGANS.length > 1 && next === sloganIdx);
  sloganIdx = next;
  const s = SLOGANS[sloganIdx];
  node.classList.add('fade');
  setTimeout(() => {
    node.textContent = '';
    const body = document.createElement('span');
    body.textContent = '"' + s.t + '"';
    node.appendChild(body);
    if (s.a) {
      const a = document.createElement('span');
      a.className = 'attr';
      a.textContent = '— ' + s.a;
      node.appendChild(a);
    }
    node.classList.remove('fade');
  }, 400);
}
